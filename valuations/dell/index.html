<style>
/* Layout: terminal shell — command line, function-key row, quote strip, one function panel at a time (Bloomberg-style). Deliberately single dark look. */
:root {
  color-scheme: dark;
  --bg: #08090b;          /* screen */
  --panel: #101216;       /* function panel */
  --panel-2: #161a1f;     /* table header / hover */
  --rule: #262b33;        /* grid lines */
  --amber: #ffa028;       /* labels, function codes */
  --amber-dim: #a8691c;
  --text: #e9e7e2;        /* values */
  --muted: #8b9099;
  --input: #f6c344;       /* editable fields (yellow, as on the terminal) */
  --input-bg: #1d1a10;
  --blue: #4aa3ff;        /* headers / links */
  --up: #3ddc84;
  --down: #ff4d4d;
  --warn: #ffcc4d;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { font: 13px/1.45 var(--mono); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 40px; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--blue); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---- command line ---- */
.cmd { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.cmd .brand { font: 600 12px var(--cond); letter-spacing: .14em; color: var(--amber); text-transform: uppercase; }
.cmd form { display: flex; flex: 1 1 260px; min-width: 0; }
.cmd input { flex: 1; min-width: 0; background: var(--input-bg); border: 1px solid var(--amber-dim); border-right: 0; padding: 5px 8px; color: var(--input); text-transform: uppercase; }
.cmd button.go { background: #2b6e2b; border: 1px solid #3f9a3f; color: #fff; padding: 5px 10px; font-weight: 600; cursor: pointer; }
.cmd .asof { color: var(--muted); font-size: 11px; }
.seg { display: inline-flex; border: 1px solid var(--rule); }
.seg button { background: none; border: 0; padding: 4px 10px; color: var(--muted); cursor: pointer; font: 500 12px var(--cond); letter-spacing: .06em; text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--amber); color: #000; }
.btn { background: var(--panel-2); border: 1px solid var(--rule); padding: 4px 10px; cursor: pointer; color: var(--text); font: 500 12px var(--cond); letter-spacing: .06em; text-transform: uppercase; }
.btn:hover { border-color: var(--amber-dim); }

/* ---- function keys ---- */
.fkeys { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 0; }
.fkeys button { background: #1a1408; border: 1px solid #3a2a10; color: var(--amber); padding: 4px 9px; cursor: pointer; font: 600 12px var(--mono); }
.fkeys button small { color: var(--muted); font: 400 11px var(--cond); margin-left: 6px; letter-spacing: .03em; }
.fkeys button[aria-selected="true"] { background: var(--amber); color: #000; border-color: var(--amber); }
.fkeys button[aria-selected="true"] small { color: #3a2400; }

/* ---- quote strip ---- */
.quote { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 0; border: 1px solid var(--rule); background: var(--panel); }
.quote > div { padding: 7px 10px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-width: 0; }
.quote .k { color: var(--amber); font: 500 11px var(--cond); letter-spacing: .08em; text-transform: uppercase; }
.quote .v { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.quote .tkr .v { color: var(--text); font-size: 18px; }
@media (min-width: 700px) { .quote .tkr { grid-column: span 2; } }
.chip { display: inline-block; padding: 1px 8px; font: 700 12px var(--cond); letter-spacing: .1em; }
.chip.over { background: var(--down); color: #000; }
.chip.under { background: var(--up); color: #000; }
.chip.fair { background: var(--warn); color: #000; }
.chip.nv { background: var(--muted); color: #000; }
input.f.miss { border-color: var(--down); background: rgba(255, 77, 77, .08); }
.dq { border: 1px solid var(--warn); padding: 6px 10px; margin-bottom: 8px; font-size: 12px; }
.dq.blk { border-color: var(--down); }
.dq summary { cursor: pointer; color: var(--warn); }
.dq.blk h2 { color: var(--down); }
.dq li { margin: 2px 0; }
.up { color: var(--up); } .down { color: var(--down); } .mut { color: var(--muted); } .amb { color: var(--amber); } .warn { color: var(--warn); }

/* ---- panels ---- */
main { margin-top: 10px; }
.title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--amber-dim); padding-bottom: 4px; margin-bottom: 10px; }
.title h1 { margin: 0; font: 600 15px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.title .sub { color: var(--muted); font-size: 12px; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.box { grid-column: span 12; background: var(--panel); border: 1px solid var(--rule); padding: 10px; min-width: 0; }
.box h2 { margin: 0 0 8px; font: 600 12px var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--blue); display: flex; justify-content: space-between; gap: 8px; }
.box h2 span { color: var(--muted); font-weight: 400; letter-spacing: .04em; text-transform: none; }
@media (min-width: 900px) {
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
  .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; }
}
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 3px 7px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
th { color: var(--amber); font: 500 11px var(--cond); letter-spacing: .06em; text-transform: uppercase; background: var(--panel-2); position: sticky; top: 0; }
td:first-child, th:first-child, td.l, th.l { text-align: left; }
tr.sum td { border-top: 1px solid var(--muted); font-weight: 600; }
tr.hl td { background: #1c1608; }
td.lbl { color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 12px; }
.kv > :nth-child(odd) { color: var(--muted); }
.kv > :nth-child(even) { text-align: right; }
.big { font-size: 28px; font-weight: 500; line-height: 1.1; }
.note { color: var(--muted); font-size: 11.5px; max-width: 75ch; }
.note b { color: var(--text); font-weight: 500; }
.verdict { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.verdict .k { color: var(--amber); font: 500 11px var(--cond); letter-spacing: .08em; text-transform: uppercase; }
.chart { position: relative; height: 260px; }
.chart.tall { height: 340px; }
.chart.short { height: 200px; }
input.f { width: 72px; background: var(--input-bg); border: 0; border-bottom: 1px solid var(--amber-dim); color: var(--input); text-align: right; padding: 1px 4px; }
input.f.w { width: 90px; }
select.f { background: var(--input-bg); border: 1px solid var(--amber-dim); color: var(--input); padding: 1px 4px; }
.heat td { color: #fff; font-weight: 500; }
.heat td.lbl, .heat th { color: var(--amber); }
.pill { display: inline-block; border: 1px solid var(--rule); padding: 0 6px; font-size: 11px; color: var(--muted); }
.list { margin: 0; padding-left: 18px; }
.list li { margin: 3px 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 5px; }
@media (max-width: 700px) { .box table { display: block; overflow-x: auto; } .big { font-size: 22px; } }
.kv > * { min-width: 0; overflow-wrap: anywhere; }
.box h2 { flex-wrap: wrap; }
.pv { display: inline-block; font: 600 9px/1.4 var(--mono); margin-left: 3px; padding: 0 3px; border: 1px solid currentColor; vertical-align: 1px; cursor: help; }
.pv.s { color: var(--up); } .pv.d { color: var(--blue); } .pv.a { color: var(--warn); } .pv.u { color: var(--muted); }
.log { font-size: 12px; max-height: 260px; overflow: auto; background: var(--bg); border: 1px solid var(--rule); padding: 6px 8px; }
.log div { white-space: pre-wrap; } .log .ok { color: var(--up); } .log .err { color: var(--down); }
footer { margin-top: 14px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--rule); padding-top: 8px; }
</style>

<header>
  <div class="cmd">
    <span class="brand">Valuation Terminal</span>
    <form id="cmdForm" autocomplete="off">
      <input id="cmdInput" aria-label="Function code" placeholder="Type a ticker to value it, or a function code (DES, DCF, WACC…)">
      <button class="go" type="submit">GO</button>
    </form>
    <select class="f" id="coSel" aria-label="Company"></select>
    <div class="seg" role="group" aria-label="Scenario" id="scenSeg"></div>
    <button class="btn" id="resetBtn" type="button">Reset inputs</button>
    <span class="asof" id="asof"></span>
  </div>
  <nav class="fkeys" role="tablist" id="fkeys"></nav>
  <div class="quote" id="quote"></div>
</header>

<main id="main"></main>
<footer id="foot"></footer>

<script>
/* model.js — valuation engine shared by the terminal UI and the tests.
 * Pure functions, no DOM. Mirrors valuation_v2.py line for line; the
 * parity test (tests/test_parity.py) checks both give identical numbers.
 * Units: USD millions except per-share; rates as decimals.
 */
(function (root) {
  "use strict";
  // default segment map (Dell); any ticker supplies its own inp.segment_defs
  const DEFAULT_DEFS = [
    { key: "ai", name: "AI-optimised servers", margin: "ai", report: "ISG" },
    { key: "trad", name: "Traditional servers & networking", margin: "core", report: "ISG" },
    { key: "storage", name: "Storage", margin: "core", report: "ISG" },
    { key: "comm", name: "CSG commercial", margin: "csg", report: "CSG" },
    { key: "cons", name: "CSG consumer", margin: "csg", report: "CSG" },
    { key: "other", name: "Other", margin: null, report: "Other" },
  ];
  const defs = (inp) => inp.segment_defs || DEFAULT_DEFS;
  const okNum = (x) => typeof x === "number" && Number.isFinite(x);
  const segKeys = (inp) => defs(inp).map((d) => d.key);
  const keySeg = (inp) => (inp.ui && inp.ui.key_segment) || defs(inp)[0].key;
  const keyMargin = (inp) => (inp.ui && inp.ui.key_margin) || defs(inp).find((d) => d.margin).margin;
  const N = 10;           // FY27..FY36
  // valuation model: "fcff" (default), "excess_return" (banks, insurers), "ddm" (REITs)
  const modelOf = (inp) => inp.model || "fcff";
  const isFin = (inp) => modelOf(inp) !== "fcff";
  const EXPLICIT = 4;     // FY28..FY31 growth given per segment

  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const median = (a) => {
    const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  const quantile = (a, q) => {           // linear interpolation (numpy default)
    const s = [...a].sort((x, y) => x - y), p = (s.length - 1) * q;
    const lo = Math.floor(p), hi = Math.ceil(p);
    return s[lo] + (s[hi] - s[lo]) * (p - lo);
  };

  // ------------------------------------------------------------ cost of capital
  function beta(inp) {
    const c = inp.capital;
    const blume = 0.67 * c.beta_raw + 0.33;
    const bu = bottomUpBeta(inp);
    const daily = c.beta_daily != null ? c.beta_daily : null;
    const chosen = c.beta_source === "raw" ? c.beta_raw
      : c.beta_source === "bottom_up" ? bu.relevered
      : c.beta_source === "custom" ? c.beta_custom
      : c.beta_source === "daily" && daily != null ? daily
      : c.beta_source === "daily_adj" && daily != null ? 0.67 * daily + 0.33
      : c.beta_source === "crsp_monthly" && c.beta_crsp_monthly != null ? c.beta_crsp_monthly
      : c.beta_source === "crsp_monthly_adj" && c.beta_crsp_monthly != null ? 0.67 * c.beta_crsp_monthly + 0.33 : blume;
    return { raw: c.beta_raw, blume, bottom_up: bu.relevered, unlevered_median: bu.median, daily,
      crsp: c.beta_crsp_monthly != null ? c.beta_crsp_monthly : null, chosen };
  }

  function bottomUpBeta(inp) {
    const t = inp.capital.tax_marginal, cols = inp.peers.columns;
    const ix = (k) => cols.indexOf(k);
    const bu = [];
    for (const tk of inp.peers.core_set) {
      const r = inp.peers.rows[tk];
      const b = r[ix("beta")], d = r[ix("debt")], e = r[ix("mcap")];
      bu.push(b == null ? null : b / (1 + (1 - t) * d / e));   // a peer with no published beta is left out, not set to 1
    }
    const ok = bu.filter((x) => x != null);
    const med = ok.length ? median(ok) : NaN;
    const E = inp.market.price * dilutedShares(inp);
    const D = inp.bridge.core_debt + inp.bridge.leases;
    return { unlevered: bu, median: med, relevered: med * (1 + (1 - t) * D / E) };
  }

  function dilutedShares(inp) { return inp.market.shares_basic + inp.market.dilution; }

  function wacc(inp) {
    const c = inp.capital, b = beta(inp);
    // Ke = rf + beta x (Rm - rf) + country risk premium (+ optional size premium)
    const mrp = marketRiskPremium(c);
    const ke = c.rf + b.chosen * mrp + (c.crp || 0) + (c.size_premium || 0);
    const E = inp.market.price * dilutedShares(inp);
    const D = inp.bridge.core_debt + inp.bridge.leases;
    const we = E / (E + D), wd = D / (E + D);
    const kd = c.kd_pretax * (1 - c.tax_marginal);
    return { wacc: we * ke + wd * kd, ke, kd_after: kd, we, wd, E, D, beta: b, mrp, rm: c.rf + mrp,
      equityPremium: b.chosen * mrp };
  }

  // MRP = Rm - rf when an expected market return is given; otherwise the stored premium
  function marketRiskPremium(c) { return c.rm != null ? c.rm - c.rf : c.erp; }

  // CAPM regression on aligned price series: [[date, close], ...] for stock and index
  function returnsFromPrices(stock, index) {
    const m = new Map(index.map(([d, p]) => [d, p]));
    const rows = stock.filter(([d]) => m.has(d)).sort((a, b) => (a[0] < b[0] ? -1 : 1));
    const rs = [], rm = [], dates = [];
    for (let i = 1; i < rows.length; i++) {
      const [d0, s0] = rows[i - 1], [d1, s1] = rows[i];
      rs.push(s1 / s0 - 1); rm.push(m.get(d1) / m.get(d0) - 1); dates.push(d1);
    }
    return { rs, rm, dates };
  }
  function capmBeta(rs, rm, periodsPerYear) {
    const n = rs.length, ppy = periodsPerYear || 252;
    const mx = sum(rm) / n, my = sum(rs) / n;
    let sxy = 0, sxx = 0, syy = 0;
    for (let i = 0; i < n; i++) { sxy += (rm[i] - mx) * (rs[i] - my); sxx += (rm[i] - mx) ** 2; syy += (rs[i] - my) ** 2; }
    const b = sxy / sxx, a = my - b * mx;
    let sse = 0; for (let i = 0; i < n; i++) sse += (rs[i] - a - b * rm[i]) ** 2;
    const s2 = sse / (n - 2), seB = Math.sqrt(s2 / sxx), seA = Math.sqrt(s2 * (1 / n + mx * mx / sxx));
    const r2 = 1 - sse / syy;
    return { beta: b, alpha: a, seBeta: seB, seAlpha: seA, tBeta: b / seB, tAlpha: a / seA, r2, n,
      alphaAnnual: Math.pow(1 + a, ppy) - 1, blume: 0.67 * b + 0.33,
      ci95: [b - 1.96 * seB, b + 1.96 * seB], volStock: Math.sqrt(syy / (n - 1) * ppy), volMkt: Math.sqrt(sxx / (n - 1) * ppy) };
  }

  // ------------------------------------------------------------ projection
  function growthPath(explicit, gT) {
    // FY28..FY31 explicit; FY32..FY36 fade linearly from FY31 rate to gT
    const g = explicit.slice(0, EXPLICIT);
    const last = g[EXPLICIT - 1];
    const fadeYears = N - 1 - EXPLICIT;   // 5
    for (let j = 1; j <= fadeYears; j++) g.push(last + (gT - last) * j / fadeYears);
    return g;                             // length 9 (FY28..FY36)
  }

  function marginPath(m0, mLR) {
    // FY27 = m0, linear to mLR at FY31 (index 4), flat after
    const out = [];
    for (let i = 0; i < N; i++) out.push(i >= EXPLICIT ? mLR : m0 + (mLR - m0) * i / EXPLICIT);
    return out;
  }

  function project(inp, scen) {
    const op = inp.operating, gT = inp.terminal.g;
    const SEGS = segKeys(inp), D = defs(inp);
    const seg = {};
    for (const s of SEGS) {
      const g = growthPath(scen.growth[s], gT);
      const r = [(inp.y1_segments || inp.fy27_segments)[s]];
      for (let i = 0; i < N - 1; i++) r.push(r[i] * (1 + g[i]));
      seg[s] = r;
    }
    const mp = {};
    for (const g of Object.keys(scen.margins)) mp[g] = marginPath(scen.margins[g][0], scen.margins[g][1]);
    const taxP = marginPath(op.tax0, op.tax_lr);
    const rows = [];
    let prevRev = inp.rev_y0;
    let shares = dilutedShares(inp);
    for (let i = 0; i < N; i++) {
      const rev = sum(SEGS.map((s) => seg[s][i]));
      const segRev = {}, reportRev = {}, reportOI = {};
      let segOIsum = 0;
      for (const d of D) {
        const oi = d.margin ? seg[d.key][i] * mp[d.margin][i] : 0;
        segRev[d.key] = seg[d.key][i];
        reportRev[d.report] = (reportRev[d.report] || 0) + seg[d.key][i];
        reportOI[d.report] = (reportOI[d.report] || 0) + oi;
        segOIsum += oi;
      }
      const corp = op.corp_pct * rev;
      const ebit = segOIsum - corp;
      const tax = taxP[i];
      const nopat = ebit * (1 - tax);
      const da = op.da_pct * rev, capex = op.capex_pct * rev;
      // year 1 against the opening balance when it is known; afterwards NWC % × the change in revenue
      const dnwc = i === 0 && op.nwc0 != null ? op.nwc_pct * rev - op.nwc0 : op.nwc_pct * (rev - prevRev);
      const fcff = nopat + da - capex - dnwc;
      if (i > 0) shares = shares * (1 - op.buyback_pct);
      const ni = (ebit - op.interest_net) * (1 - tax);
      const niAdj = (ebit + corp - op.interest_net) * (1 - tax);
      rows.push({
        label: inp.meta.year_labels[i], rev, growth: rev / prevRev - 1, seg: segRev, reportRev, reportOI,
        corp, ebit, margin: ebit / rev, tax, nopat, da, ebitda: ebit + da, capex, dnwc, fcff,
        shares, ni, eps: ni / shares, epsAdj: niAdj / shares,
      });
      prevRev = rev;
    }
    return rows;
  }

  // ------------------------------------------------------------ DCF
  function dcf(inp, scen, override) {
    if (isFin(inp)) return finValue(inp, scen, override);
    const w = override && override.wacc != null ? override.wacc : wacc(inp).wacc;
    const tm = Object.assign({}, inp.terminal, override && override.terminal);
    const rows = project(inp, scen);
    const { first_period: fp, stub, mid_year: mid } = inp.timing;
    let pvSum = 0;
    rows.forEach((r, i) => {
      const frac = i === 0 ? stub : 1;
      const tEnd = fp + i;
      const t = Math.max(mid ? tEnd - 0.5 * frac : tEnd, 0);
      r.frac = frac; r.t = t; r.df = Math.pow(1 + w, -t);
      r.pv = r.fcff * frac * r.df;
      pvSum += r.pv;
    });
    const last = rows[N - 1], tEndN = fp + N - 1;
    if (tm.g >= w) throw new Error("terminal growth must be below WACC");
    const tvGordon = last.nopat * (1 + tm.g) * (1 - tm.g / tm.ronic) / (w - tm.g);
    const pvGordon = tvGordon * Math.pow(1 + w, -(mid ? tEndN - 0.5 : tEndN));
    const tvExit = tm.exit_multiple * last.ebitda;
    const pvExit = tvExit * Math.pow(1 + w, -tEndN);
    const useExit = tm.method === "exit";
    const pvTV = useExit ? pvExit : pvGordon;
    const ev = pvSum + pvTV;
    const b = inp.bridge;
    const dfsNet = b.dfs_receivables + b.dfs_lease_equipment - b.dfs_debt;
    const equity = ev + b.cash - b.core_debt - b.leases + dfsNet + b.investments - b.nci;
    const sh = dilutedShares(inp);
    // implied cross-checks
    // g that makes a plain Gordon TV on FCFF_N equal the exit-multiple TV
    const impliedG = (tvExit * w - last.fcff) / (tvExit + last.fcff);
    return {
      wacc: w, rows, pvExplicit: pvSum, tvGordon, pvGordon, tvExit, pvExit, pvTV,
      tv: useExit ? tvExit : tvGordon, ev, dfsNet, equity, perShare: equity / sh,

  // ------------------------------------------------------------ financials

  function dpsGrowthPath(explicit, gT) {

  function earningsQuality(inp) {

<script>
"use strict";
const M = window.VModel;
const TABS = [
  ["LOAD", "Research a ticker"], ["DES", "Summary"], ["VAL", "5-step valuation"], ["FA", "Financials"], ["EQ", "Earnings quality"], ["EE", "Estimates"], ["MODEL", "Segment model"],
  ["WACC", "Cost of capital"], ["BETA", "Beta regression"],
  ["DCF", "DCF"], ["SENS", "Sensitivity"], ["MC", "Monte Carlo"], ["RV", "Relative value"], ["ANR", "Street"],
  ["FFLD", "Football field"], ["AUD", "Audit inputs"], ["SRC", "Sources"],
];
const RS = window.VResearch;
// ---- companies: one worked example ships with the page; every researched ticker is saved in this browser
const CO = { list: {}, active: "builtin" };
try { CO.list = JSON.parse(localStorage.getItem("vt_companies_DELL") || "{}"); } catch (e) { CO.list = {}; }
try { const a = localStorage.getItem("vt_active_DELL"); if (a && (a === "builtin" || CO.list[a])) CO.active = a; } catch (e) {}
const companyData = (t) => (t === "builtin" ? DATA : CO.list[t]);
function saveCompanies() { try { localStorage.setItem("vt_companies_DELL", JSON.stringify(CO.list)); localStorage.setItem("vt_active_DELL", CO.active); } catch (e) {} }
const S = { inp: M.clone(companyData(CO.active) || DATA), scen: "Base", tab: "DES", mc: null, mcKey: "", charts: {} };
try { const t = localStorage.getItem("vt_tab_DELL"); if (t && TABS.some((x) => x[0] === t)) S.tab = t; } catch (e) {}
if (location.hash && TABS.some((x) => x[0] === location.hash.slice(1).toUpperCase())) S.tab = location.hash.slice(1).toUpperCase();

// ---------------------------------------------------------------- format
const $ = (id) => document.getElementById(id);
const f0 = (x) => (x == null || !isFinite(x)) ? "—" : x.toLocaleString("en-US", { maximumFractionDigits: 0 });
const f1 = (x) => (x == null || !isFinite(x)) ? "—" : x.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const f2 = (x) => (x == null || !isFinite(x)) ? "—" : x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const px = (x) => (x == null || !isFinite(x)) ? "—" : "$" + f2(x);
const pct = (x, d = 1) => (x == null || !isFinite(x)) ? "—" : (x * 100).toFixed(d) + "%";
const spct = (x, d = 1) => (x == null || !isFinite(x)) ? "—" : (x >= 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
const bn = (x) => (x == null || !isFinite(x)) ? "—" : "$" + (x / 1000).toFixed(1) + "B";
const mx = (x) => (x == null || !isFinite(x)) ? "—" : x.toFixed(1) + "x";
const cls = (x) => x > 0 ? "up" : x < 0 ? "down" : "";
const get = (o, p) => p.split(".").reduce((a, k) => a[k], o);
const set = (o, p, v) => { const ks = p.split("."); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };

const UI = () => Object.assign({ key_segment_label: "Key segment", key_margin_label: "key margin" }, S.inp.ui || {});
const KS = () => M.keySeg(S.inp), KM = () => M.keyMargin(S.inp);
const Y = (i) => S.inp.meta.year_labels[i];
const segName = (k) => (M.defs(S.inp).find((d) => d.key === k) || { name: k }).name;
const mgName = (g) => (S.inp.margin_groups || {})[g] || g;
// editable field: data-p = path in S.inp, data-k = pct | num
function fld(path, kind = "pct", w = "", dec) {
  const v = get(S.inp, path);
  const d = dec != null ? dec : kind === "pct" ? 2 : 2;
  const miss = typeof v !== "number" || !isFinite(v);
  const shown = miss ? "" : kind === "pct" ? (v * 100).toFixed(d) : Number(v).toFixed(d);
  return `<input class="f ${w}${miss ? " miss" : ""}" data-p="${path}" placeholder="${miss ? "missing" : ""}" data-k="${kind}" value="${shown}" inputmode="decimal" aria-label="${path}">${kind === "pct" ? '<span class="mut">%</span>' : ""}${pv(path)}`;
}
// provenance badge: S = sourced from a filing or data feed, D = derived from sourced numbers, A = assumption
function pv(path) {
  const p = (S.inp.provenance || {})[path];
  if (!p) return `<span class="pv u" title="No source recorded">?</span>`;
  const k = p[0] === "sourced" ? "s" : p[0] === "derived" ? "d" : "a";
  return `<span class="pv ${k}" title="${String(p[1]).replace(/"/g, "&quot;")}">${k.toUpperCase()}</span>`;
}

// ---------------------------------------------------------------- compute
function compute() {
  const inp = S.inp, scen = inp.scenarios[S.scen];
  const Q = M.checkInputs(inp);
  if (!Q.ok) return { blocked: Q, ver: M.verdict(inp, {}) };
  const W = M.wacc(inp);
  const base = M.dcf(inp, scen);
  const scen3 = {}; for (const k of Object.keys(inp.scenarios)) scen3[k] = M.dcf(inp, inp.scenarios[k]);
  const rel = M.relative(inp);
  const rows = base.rows;
  const sg = inp.relative && inp.relative.subject_growth;
  const egr = sg != null && isFinite(sg) ? sg : Math.pow(rows[3].epsAdj / rows[0].epsAdj, 1 / 3) - 1;
  const reg = inp.model === "ddm" ? { implied: NaN, n: 0, points: [] } : M.regression(inp, egr);
  const key = JSON.stringify([inp, S.scen]);
  if (S.mcKey !== key) { S.mc = M.monteCarlo(inp, scen, { n: 1500, seed: 7 }); S.mcKey = key; }
  const mc = S.mc;
  const ver = M.verdict(inp, { dcf: base.perShare, mc: mc.median, comps: rel.blended, regression: reg.implied });
  if (reg.weak && isFinite(reg.r2)) ver.warnings = ver.warnings.filter((w) => w.path !== "verdict.weights.regression"), ver.warnings.push({ path: "relative.reg_min_r2", msg: `Peer regression R² ${reg.r2.toFixed(2)} is below ${reg.minR2.toFixed(2)}; it is shown but left out of the blend` });
  const w = W.wacc;
  if (M.isFin(inp)) {
    const k = W.ke, rev = { ke: M.reverse(inp, scen, "wacc", inp.terminal.g + 0.006, 0.3), g: M.reverse(inp, scen, "g", -0.05, k - 0.0005) };
    if (inp.model === "excess_return") { rev.roe = M.reverse(inp, scen, "roe_lr", -0.2, 0.8); rev.persist = M.reverse(inp, scen, "persistence", 0, 1); }
    else rev.dps = M.reverse(inp, scen, "dps_shift", -0.3, 0.3);
    return { W, base, scen3, rel, reg, mc, ver, rev, egr, pv: M.pvgo(inp), checks: Q };
  }
  const rev = {
    wacc: M.reverse(inp, scen, "wacc", 0.04, 0.25),
    margin: M.reverse(inp, scen, "margin_shift", -0.15, 0.3),
    ai: M.reverse(inp, scen, "ai_shift", -0.6, 3),
    all: M.reverse(inp, scen, "all_growth_shift", -0.3, 0.5),
    g: M.reverse(inp, scen, "g", -0.05, w - 0.0005),
  };
  if (isFinite(rev.margin)) { const k = M.applyKnob(inp, scen, "margin_shift", rev.margin); rev.marginEbit = M.dcf(k.I, k.S).rows[4].margin; }
  return { W, base, scen3, rel, reg, mc, ver, rev, egr, pv: M.pvgo(inp), checks: Q };
}

// ---------------------------------------------------------------- header
function renderHeader(R) {
  const m = S.inp.market, ch = m.price - m.prev_close, chp = ch / m.prev_close;
  const sh = M.dilutedShares(S.inp);
  const v = R.ver;
  const chip = v.call === "OVERVALUED" ? "over" : v.call === "UNDERVALUED" ? "under" : v.call === "NOT VALUED" || v.call === "NO CALL" ? "nv" : "fair";
  const eqg = v.quality ? v.quality.grade : "n/a";
  const eqBadge = `<a href="#EQ" data-tab="EQ" title="Earnings quality grade${v.confidence === "low" ? ": low confidence" : ""}" style="margin-left:6px;font:600 11px var(--mono);color:${GRADE_COL[eqg]};border:1px solid currentColor;padding:0 4px;text-decoration:none">EQ ${eqg}</a>`;
  const nz =(x, f) => (typeof x === "number" && isFinite(x) ? f(x) : "—");
  if (R.blocked) $("quote").innerHTML = `
    <div class="tkr"><div class="k">${S.inp.meta.ticker} US Equity</div><div class="v">${nz(m.price, px)}</div></div>
    <div><div class="k">Call</div><div class="v"><span class="chip nv">NOT VALUED</span></div></div>
    <div><div class="k">Blocking inputs</div><div class="v neg">${R.blocked.blocking.length}</div></div>
    <div><div class="k">Street median</div><div class="v">${nz(S.inp.consensus.targets.median, px)}</div></div>`;
  else $("quote").innerHTML = `
    <div class="tkr"><div class="k">${S.inp.meta.ticker} US Equity</div><div class="v">${px(m.price)} <span class="${cls(ch)}" style="font-size:13px">${ch.toFixed(2)} ${spct(chp, 2)}</span></div></div>
    <div><div class="k">Mkt cap (dil.)</div><div class="v">${bn(m.price * sh)}</div></div>
    <div><div class="k">Fair value</div><div class="v">${px(v.fair)}</div></div>
    <div><div class="k">Upside</div><div class="v ${cls(v.upside)}">${spct(v.upside)}</div></div>
    <div><div class="k">Call (±${pct(S.inp.verdict.band, 0)})${v.confidence === "low" ? " · low confidence" : ""}</div><div class="v"><span class="chip ${chip}">${v.call}</span>${eqBadge}</div></div>
    <div><div class="k">Exp. alpha 1y</div><div class="v ${cls(v.alpha)}">${spct(v.alpha)}</div></div>
    ${M.isFin(S.inp) ? `<div><div class="k">Ke (${S.inp.model === "ddm" ? "DDM" : "excess return"})</div><div class="v">${pct(R.W.ke, 2)}</div></div>`
      : `<div><div class="k">WACC / Ke</div><div class="v">${pct(R.W.wacc, 2)} / ${pct(R.W.ke, 2)}</div></div>`}
    <div><div class="k">Street median</div><div class="v">${px(S.inp.consensus.targets.median)}</div></div>`;
  $("cmdInput").placeholder = `${S.inp.meta.ticker} US Equity  ${S.tab} <GO>   (type DCF, WACC, RV, ANR…)`;
  $("asof").textContent = `Px ${S.inp.meta.price_date} · BS ${S.inp.meta.balance_sheet_date} · USD m`;
  const cos = ["builtin", ...Object.keys(CO.list)];
  $("coSel").innerHTML = cos.map((t) => `<option value="${t}" ${t === CO.active ? "selected" : ""}>${t === "builtin" ? DATA.meta.ticker + " · published valuation" : t}</option>`).join("");
  $("scenSeg").innerHTML = Object.keys(S.inp.scenarios).map((k) =>
    `<button type="button" data-scen="${k}" aria-pressed="${k === S.scen}">${k}</button>`).join("");
  const finLab = M.isFin(S.inp) ? { MODEL: S.inp.model === "ddm" ? "Dividend model" : "ROE model", DCF: S.inp.model === "ddm" ? "DDM" : "Excess return" } : {};
  $("fkeys").innerHTML = TABS.map(([c, n0], i) => { const n = finLab[c] || n0; return `<button type="button" role="tab" data-tab="${c}" aria-selected="${c === S.tab}">${c}<small>${n}</small></button>`; }).join("");
}

// ---------------------------------------------------------------- charts
const HAS_CHART = typeof Chart !== "undefined";
if (HAS_CHART) {
  Chart.defaults.color = "#8b9099";
  Chart.defaults.borderColor = "#262b33";
  Chart.defaults.font.family = '"IBM Plex Mono", ui-monospace, monospace';
  Chart.defaults.font.size = 11;
}
const vlines = {
  id: "vlines",
  afterDatasetsDraw(chart, _a, opts) {
    if (!opts || !opts.lines) return;
    const { ctx, chartArea: a } = chart, xs = chart.scales.x, ys = chart.scales.y;
    for (const L of opts.lines) {
      ctx.save(); ctx.strokeStyle = L.color; ctx.lineWidth = L.width || 1.5; ctx.setLineDash(L.dash || []);
      ctx.beginPath();
      if (L.axis === "y") { const y = ys.getPixelForValue(L.value); ctx.moveTo(a.left, y); ctx.lineTo(a.right, y); }
      else { const x = xs.getPixelForValue(L.value); ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom); }
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = L.color; ctx.font = '11px "IBM Plex Mono", monospace';
      if (L.axis === "y") ctx.fillText(L.label, a.left + 4, ys.getPixelForValue(L.value) - 4);
      else ctx.fillText(L.label, Math.min(xs.getPixelForValue(L.value) + 4, a.right - ctx.measureText(L.label).width - 2), a.top + 12 + (L.row || 0) * 13);
      ctx.restore();
    }
  },
};
if (HAS_CHART) Chart.register(vlines);
function chart(id, cfg) {
  if (S.charts[id]) S.charts[id].destroy();
  const el = $(id); if (!el) return;
  if (!HAS_CHART) { el.parentNode.innerHTML = '<p class="note">Chart library did not load; the numbers in the tables are unaffected.</p>'; return; }
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: false }, cfg.options || {});
  S.charts[id] = new Chart(el, cfg);
}
function floatBars(id, items, lines, xmin, xmax) {

// ---------------------------------------------------------------- tabs
function ffItems(R) {
  if (M.isFin(S.inp)) return finFfItems(R);
  const I = S.inp, c = I.consensus.targets, m = I.market, sc = R.scen3, rt = R.rel.table;
  const w = R.W.wacc, scen = I.scenarios[S.scen];
  const g = M.sensitivity(I, scen, "wacc", [w - 0.01, w + 0.01], "g", [I.terminal.g - 0.005, I.terminal.g + 0.005]).flat();
  const I2 = M.clone(I); I2.terminal.method = "exit";
  const exits = [10, 14].map((k) => { const J = M.clone(I2); J.terminal.exit_multiple = k; return M.dcf(J, scen).perShare; });
  const regLo = M.regression(I, R.egr - 0.05).implied, regHi = M.regression(I, R.egr + 0.05).implied;
  return [
    { label: "52-week range", lo: m.low_52w, hi: m.high_52w, color: "#4b525c" },
    { label: "Street targets (low–high)", lo: c.low, hi: c.high, color: "#6b5a2a" },
    { label: "DCF bear–bull", lo: sc.Bear.perShare, hi: sc.Bull.perShare, color: "#2f6db3" },
    { label: "DCF WACC ±1pp, g ±0.5pp", lo: Math.min(...g), hi: Math.max(...g), color: "#2f6db3" },
    { label: "DCF exit 10x–14x EBITDA", lo: Math.min(...exits), hi: Math.max(...exits), color: "#2f6db3" },
    { label: "Monte Carlo p10–p90", lo: R.mc.p10, hi: R.mc.p90, color: "#2a7f62" },
    ...Object.keys(rt).filter((k) => rt[k].usable).map((k) => ({ label: `Comps ${({ pe_fwd: "fwd P/E", ev_ebitda: "EV/EBITDA", ev_sales: "EV/Sales" })[k] || k} (IQR)`,
      lo: Math.min(rt[k].impliedQ1, rt[k].impliedQ3), hi: Math.max(rt[k].impliedQ1, rt[k].impliedQ3), color: "#7a4fb3" })),
    { label: "P/E–growth regression ±5pp g", lo: Math.min(regLo, regHi), hi: Math.max(regLo, regHi), color: "#7a4fb3" },
  ];
}
function ffLines(R) {
  return [
    { value: S.inp.market.price, color: "#ff4d4d", dash: [5, 4], label: `Price ${px(S.inp.market.price)}`, row: 0 },
    { value: R.ver.fair, color: "#ffa028", label: `Fair ${px(R.ver.fair)}`, row: 1 },
  ];
}

RENDER.WACC = (R) => {
  const I = S.inp, W = R.W, b = W.beta, bu = M.bottomUpBeta(I), cols = I.peers.columns, ix = (k) => cols.indexOf(k), c = I.capital;
  const st = c.beta_daily_stats;
  const step = (n, label, val, note) => `<tr><td class="amb">${n}</td><td style="text-align:left;white-space:normal">${label}</td><td>${val}</td><td class="mut" style="text-align:left;white-space:normal">${note || ""}</td></tr>`;
  const betaOpts = [["daily", "Daily regression vs S&P 500 (raw)"], ["daily_adj", "Daily regression, adjusted"], ["crsp_monthly", "CRSP monthly regression (raw)"], ["crsp_monthly_adj", "CRSP monthly regression, adjusted"], ["blume", "Published 5Y, adjusted"], ["raw", "Published 5Y, raw"], ["bottom_up", "Bottom-up (peers)"], ["custom", "Custom"]];
  const cst = c.beta_crsp_monthly_stats;
  return `
  <div class="title"><h1>WACC · Cost of capital</h1><div class="sub">Cost of equity built in six steps, then debt and weights</div></div>
  ${M.isFin(I) ? `<div class="dq"><b>${MODEL_NAME[I.model]}:</b> only the cost of equity (${pct(W.ke, 2)}) is used. Debt is part of the business, so the cost of debt and the WACC below are shown for reference and do not change the value.</div>` : ""}
  <div class="grid">
    <section class="box c8"><h2>Cost of equity <span>CAPM: Ke = rf + β × (Rm − rf) + CRP</span></h2><div class="scroll"><table>
      <thead><tr><th>Step</th><th class="l">Input</th><th>Value</th><th class="l">Source / note</th></tr></thead><tbody>
      ${step(1, "Risk-free rate: 10-year Treasury yield", fld("capital.rf"), I.meta.price_date)}
      ${step(2, "Expected return on the overall market (S&P 500), Rm", fld("capital.rm"), (I.notes && I.notes.rm) || "")}
      ${step(3, "Market risk premium = Rm − rf", `<b>${pct(W.mrp, 2)}</b>`, `${pct(W.rm, 2)} − ${pct(c.rf, 2)}`)}
      ${step(4, `Beta <select class="f" id="betaSrc" aria-label="Beta source">${betaOpts.map(([v, n]) => `<option value="${v}" ${c.beta_source === v ? "selected" : ""} ${(v.startsWith("daily") && b.daily == null) || (v.startsWith("crsp") && b.crsp == null) ? "disabled" : ""}>${n}</option>`).join("")}</select>`, `<b>${b.chosen.toFixed(3)}</b>`,
        [b.daily != null ? `Daily: β ${b.daily.toFixed(3)}, R² ${st ? st.r2.toFixed(3) : "—"}, n ${st ? st.n : "—"}${st && st.window ? ", " + st.window : ""}` : `Daily regression not run yet (<a href="#BETA" data-tab="BETA">BETA</a>).`,
         cst ? `CRSP monthly: β ${cst.beta.toFixed(3)}, R² ${cst.r2.toFixed(3)}, n ${cst.n}, ${cst.window}.` : "",
         `Published 5Y: ${c.beta_raw.toFixed(2)} (adjusted ${b.blume.toFixed(3)}).`].filter(Boolean).join(" "))}
      ${step(5, `Equity risk premium for ${I.meta.ticker} = β × MRP`, `<b>${pct(W.equityPremium, 2)}</b>`, `${b.chosen.toFixed(3)} × ${pct(W.mrp, 2)}`)}
      ${step("+", "Country risk premium (0 for the US)", fld("capital.crp"), "Damodaran CRP; add only for non-US exposure")}
      ${step(6, "Cost of equity = rf + β × MRP + CRP", `<b class="amb">${pct(W.ke, 2)}</b>`, `${pct(c.rf, 2)} + ${pct(W.equityPremium, 2)}${c.crp ? " + " + pct(c.crp, 2) : ""}`)}
      </tbody></table></div>
      <p class="note">Beta multiplies the <b>premium</b> (Rm − rf), not Rm itself. Using β × Rm + rf would count the risk-free rate twice and add β × rf = ${pct(b.chosen * c.rf, 2)} to Ke.</p></section>
    <section class="box c4"><h2>Result</h2><div class="big amb">${pct(W.wacc, 2)}</div>
      <div class="kv" style="margin-top:8px">
        <span>Cost of equity</span><span>${pct(W.ke, 2)}</span>
        <span>Pre-tax cost of debt ${(I.notes && I.notes.kd) || ""}</span><span>${fld("capital.kd_pretax")}</span>
        <span>Marginal tax rate</span><span>${fld("capital.tax_marginal", "pct", "", 1)}</span>
        <span>After-tax cost of debt</span><span>${pct(W.kd_after, 2)}</span>
        <span>Equity (price × diluted shares)</span><span>${bn(W.E)} · ${pct(W.we)}</span>
        <span>Debt (core debt + leases)</span><span>${bn(W.D)} · ${pct(W.wd)}</span>
        ${I.bridge.dfs_debt ? `<span>Captive-finance debt (excluded)</span><span class="mut">${bn(I.bridge.dfs_debt)}</span>` : ""}
      </div>
      <p class="note">WACC = ${pct(W.we)} × ${pct(W.ke, 2)} + ${pct(W.wd)} × ${pct(W.kd_after, 2)}</p></section>
    <section class="box"><h2>Cross-check: bottom-up beta <span>Hamada: βu = βl / (1 + (1−t)·D/E); median relevered at ${I.meta.ticker}'s D/E of ${pct(W.D / W.E)}</span></h2><div class="scroll"><table>
      <thead><tr><th>Peer</th><th>Levered β</th><th>Mkt cap $m</th><th>Debt $m</th><th>D/E</th><th>Unlevered β</th></tr></thead><tbody>

      <tr class="sum"><td>Median unlevered → relevered for ${I.meta.ticker}</td><td></td><td></td><td></td><td></td><td>${bu.median.toFixed(3)} → ${bu.relevered.toFixed(3)}</td></tr>
      </tbody></table></div></section>
  </div>`;
};

RENDER.BETA = () => {

  const fx = (x, k) => (x == null || !isFinite(x)) ? "—" : Number(x).toFixed(k);
  const res = (r) => r ? `<div class="scroll"><table><thead><tr><th>Regression statistics</th><th></th></tr></thead><tbody>
      <tr><td>Observations</td><td>${r.n}</td></tr><tr><td>Window</td><td>${r.window || "—"}</td></tr>
      <tr><td>R square</td><td>${fx(r.r2, 6)}</td></tr><tr><td>Multiple R</td><td>${fx(Math.sqrt(r.r2), 6)}</td></tr>
      <tr class="hl"><td><b>Beta (X variable)</b></td><td><b>${fx(r.beta, 6)}</b></td></tr>
      <tr><td>Std error of beta</td><td>${fx(r.seBeta, 6)}</td></tr><tr><td>t-stat of beta</td><td>${fx(r.tBeta, 2)}</td></tr>
      <tr><td>95% interval</td><td>${fx(r.ci95[0], 3)} – ${fx(r.ci95[1], 3)}</td></tr>
      <tr><td>Intercept (daily alpha)</td><td>${fx(r.alpha, 6)} <span class="mut">t ${fx(r.tAlpha, 2)}</span></td></tr>
      <tr><td>Alpha annualised (Jensen)</td><td class="${cls(r.alphaAnnual)}">${spct(r.alphaAnnual)}</td></tr>
      <tr><td>Adjusted beta (0.67β + 0.33)</td><td>${fx(r.blume, 4)}</td></tr>
      <tr><td>Volatility: stock / index (ann.)</td><td>${r.volStock != null ? pct(r.volStock) + " / " + pct(r.volMkt) : "—"}</td></tr></tbody></table></div>` : `<p class="note">No regression yet.</p>`;
  return `
  <div class="title"><h1>BETA · Daily regression vs S&P 500</h1><div class="sub">R(${I.meta.ticker}) = α + β·R(S&P 500) + ε on daily returns</div></div>
  <div class="grid">
    <section class="box c6"><h2>Load prices <span>Yahoo Finance → Historical Data → Download</span></h2>
      <div class="kv">
        <span>${I.meta.ticker} daily prices (CSV)</span><span><input type="file" id="fStock" accept=".csv,text/csv" aria-label="stock csv"></span>
        <span>S&P 500 (^GSPC) daily prices (CSV)</span><span><input type="file" id="fIndex" accept=".csv,text/csv" aria-label="index csv"></span>
        <span>Window</span><span><select class="f" id="bWin" aria-label="window"><option value="504">2 years (Bloomberg-style)</option><option value="252">1 year</option><option value="1260">5 years</option><option value="0">All rows</option></select></span>
      </div>
      <p class="note">Uses Adj Close when the file has it, otherwise Close. Dates are matched across the two files before returns are taken, so holidays and gaps don't shift the series. A CSV with just Date and Close columns also works. Run <code>python beta_daily.py DELL</code> on your laptop to do the same with yfinance and save it into the inputs file.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="btn" type="button" id="bRun">Run regression</button>
        <button class="btn" type="button" id="bUseRaw" ${st ? "" : "disabled"}>Use raw β in WACC</button>
        <button class="btn" type="button" id="bUseAdj" ${st ? "" : "disabled"}>Use adjusted β in WACC</button>
      </div>
      <p class="note" id="bMsg"></p></section>
    <section class="box c6"><h2>Summary output</h2>${res(st)}</section>
    <section class="box"><h2>Scatter <span>daily returns</span></h2><div class="chart"><canvas id="cBeta"></canvas></div></section>
    ${st && st.robustness ? `<section class="box c6"><h2>Robustness <span>does the beta survive other windows and data choices?</span></h2><div class="scroll"><table><thead><tr><th>Specification</th><th>β</th><th>SE</th><th>n</th></tr></thead><tbody>
      ${st.robustness.map(([n, b, se, k]) => `<tr><td>${n}</td><td>${b.toFixed(3)}</td><td>${se.toFixed(3)}</td><td>${k}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">Every specification lands near 2, so the high beta is not driven by a few extreme days. It reflects the 2025–26 AI-server regime and is rising (year 2 above year 1). The WACC uses the adjusted beta (0.67β + 0.33) because raw betas this far from 1 tend to drift back toward the market.</p></section>` : ""}
    ${I.capital.beta_crsp_monthly_stats ? `<section class="box c6"><h2>CRSP monthly regression <span>your WRDS CCM file · ${I.capital.beta_crsp_monthly_stats.window}</span></h2>${res(I.capital.beta_crsp_monthly_stats)}
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="bUseCrsp">Use CRSP β in WACC</button><button class="btn" type="button" id="bUseCrspAdj">Use adjusted CRSP β</button></div></section>` : ""}
    ${I.peers.crsp_monthly_beta ? `<section class="box c6"><h2>Peer betas, same CRSP window</h2><div class="scroll"><table><thead><tr><th>Ticker</th><th>β</th><th>SE</th><th>R²</th><th>n</th><th>Adjusted</th></tr></thead><tbody>
      ${Object.entries(I.peers.crsp_monthly_beta).map(([t, r]) => `<tr><td>${t}</td><td>${fx(r.beta, 3)}</td><td>${fx(r.seBeta, 3)}</td><td>${fx(r.r2, 3)}</td><td>${r.n}</td><td>${fx(r.blume, 3)}</td></tr>`).join("")}
      </tbody></table></div><p class="note">Monthly returns understate co-movement less than daily ones for thinly traded stocks but carry fewer observations, so standard errors are wider. A daily two-year regression is the primary estimate; this is the cross-check.</p></section>` : ""}
  </div>`;
};
RENDER.BETA.after = () => {
  const readCSV = (file) => new Promise((ok, bad) => {
    const fr = new FileReader(); fr.onerror = () => bad(new Error("could not read " + file.name)); fr.onload = () => ok(fr.result); fr.readAsText(file);
  });
  const toISO = (d) => {
    d = d.trim().replace(/"/g, "");
    if (/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0, 10);
    const t = new Date(d); if (isNaN(t)) return null;
    return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0");
  };
  const parse = (txt) => {
    const lines = txt.trim().split(/\r?\n/), head = lines[0].split(",").map((h) => h.trim().replace(/"/g, "").toLowerCase());
    let ci = head.indexOf("adj close"); if (ci < 0) ci = head.indexOf("close"); if (ci < 0) ci = 1;
    const di = Math.max(0, head.indexOf("date"));
    const out = [];
    for (const ln of lines.slice(1)) {
      const p = ln.split(","), d = toISO(p[di] || ""), v = parseFloat((p[ci] || "").replace(/[$"]/g, ""));
      if (d && isFinite(v) && v > 0) out.push([d, v]);
    }
    return out.sort((a, b) => (a[0] < b[0] ? -1 : 1));
  };
  const st = S.inp.capital.beta_daily_stats;
  if (st && st.points) chart("cBeta", { type: "scatter", data: { datasets: [
    { data: st.points.map(([x, y]) => ({ x: x * 100, y: y * 100 })), backgroundColor: "rgba(74,163,255,.45)", pointRadius: 2 },
    { data: [{ x: st.xmin * 100, y: (st.alpha + st.beta * st.xmin) * 100 }, { x: st.xmax * 100, y: (st.alpha + st.beta * st.xmax) * 100 }], type: "line", borderColor: "#ffa028", pointRadius: 0 },
  ] }, options: { plugins: { legend: { display: false } }, scales: { x: { title: { display: true, text: "S&P 500 daily return, %" } }, y: { title: { display: true, text: S.inp.meta.ticker + " daily return, %" } } } } });
  $("bRun").addEventListener("click", async () => {
    const fs = $("fStock").files[0], fi = $("fIndex").files[0];
    if (!fs || !fi) { $("bMsg").textContent = "Choose both CSV files first."; return; }
    try {
      const [a, b] = await Promise.all([readCSV(fs), readCSV(fi)]);
      const sp = parse(a), ip = parse(b), win = parseInt($("bWin").value, 10);
      let { rs, rm, dates } = M.returnsFromPrices(sp, ip);
      if (win > 0 && rs.length > win) { rs = rs.slice(-win); rm = rm.slice(-win); dates = dates.slice(-win); }
      if (rs.length < 30) { $("bMsg").textContent = `Only ${rs.length} matching days. Check that both files cover the same dates.`; return; }
      const r = M.capmBeta(rs, rm);
      r.window = `${dates[0]} to ${dates[dates.length - 1]}`;
      const step = Math.max(1, Math.floor(rs.length / 600));
      r.points = rs.map((y, i) => [rm[i], y]).filter((_, i) => i % step === 0);
      r.xmin = Math.min(...rm); r.xmax = Math.max(...rm);
      S.inp.capital.beta_daily = r.beta; S.inp.capital.beta_daily_stats = r;
      render();
    } catch (e) { $("bMsg").textContent = e.message; }
  });
  const use = (src) => { S.inp.capital.beta_source = src; go("WACC"); };
  $("bUseRaw").addEventListener("click", () => use("daily"));
  $("bUseAdj").addEventListener("click", () => use("daily_adj"));
  if ($("bUseCrsp")) { $("bUseCrsp").addEventListener("click", () => use("crsp_monthly")); $("bUseCrspAdj").addEventListener("click", () => use("crsp_monthly_adj")); }
};

RENDER.VAL = (R) => {

      </tbody></table></div>
      <p class="note">Historic FCF is the company's reported adjusted free cash flow; the forecast is FCFF = EBIT × (1 − tax) + D&A − capex − change in working capital. The forecast drivers are in <a href="#MODEL" data-tab="MODEL">MODEL</a>.</p></section>
    <section class="box c4"><h2>2 · Discount rate (WACC)</h2><div class="kv">

      <span>After-tax cost of debt</span><span>${pct(W.kd_after, 2)}</span>

      <span><b class="amb">WACC</b></span><span><b>${pct(W.wacc, 2)}</b></span></div>
      <p class="note">Full build in <a href="#WACC" data-tab="WACC">WACC</a>; daily beta in <a href="#BETA" data-tab="BETA">BETA</a>.</p></section>
    <section class="box c8"><h2>3 · Discount the cash flows <span>PV = FCFF ÷ (1 + WACC)^t</span></h2><div class="scroll"><table>
      <thead><tr><th></th>${rows.map((r) => `<th>${r.label}</th>`).join("")}<th>Terminal</th></tr></thead><tbody>

      </tbody></table></div>
      <div class="kv" style="margin-top:8px"><span>Sum of PV, ${rows[0].label}–${rows[rows.length - 1].label}</span><span>${f0(b.pvExplicit)}</span>
      <span>+ PV of terminal value (g ${pct(I.terminal.g, 1)}, ${I.terminal.method === "exit" ? I.terminal.exit_multiple + "x EBITDA" : "RONIC " + pct(I.terminal.ronic, 0)})</span><span>${f0(b.pvTV)}</span>

function heat(grid, rowsV, colsV, rf, cf, price, cur) {
  const flat = grid.flat().filter(isFinite), lo = Math.min(...flat), hi = Math.max(...flat);
  const color = (v) => {
    if (!isFinite(v)) return "#262b33";
    const t = (v - price) / Math.max(price - lo, hi - price, 1);
    const a = Math.min(1, Math.abs(t));
    return t < 0 ? `rgba(255,77,77,${0.25 + 0.65 * a})` : `rgba(61,220,132,${0.25 + 0.65 * a})`;
  };
  return `<div class="scroll"><table class="heat"><thead><tr><th></th>${colsV.map((c) => `<th>${cf(c)}</th>`).join("")}</tr></thead><tbody>
    ${grid.map((r, i) => `<tr><td class="lbl">${rf(rowsV[i])}</td>${r.map((v, j) => `<td style="background:${color(v)};${cur && cur[0] === i && cur[1] === j ? "outline:2px solid #ffa028;outline-offset:-2px" : ""}">${isFinite(v) ? f0(v) : "—"}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}

async function research(ticker, peerList) {
  const mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null;
  if (!mcp) throw { code: "no_mcp" };
  const t = ticker.toUpperCase();
  logLine(`Opening Yahoo Finance for ${t} in the Claude app browser…`);
  const opened = textOf(await mcp.callTool(HOST, "preview_start", { url: `https://finance.yahoo.com/quote/${encodeURIComponent(t)}/` }));
  const m = /tabId\s+([A-Za-z0-9_-]+)/.exec(opened);
  const tabId = m ? m[1] : undefined;
  const page = async (url, label) => {
    if (label) logLine(label);
    await mcp.callTool(HOST, "navigate", tabId ? { url, tabId } : { url });
    return textOf(await mcp.callTool(HOST, "get_page_text", tabId ? { tabId, max_chars: 1500000 } : { max_chars: 1500000 }));
  };
  const crumb = RS.bodyOf(await page(RS.Y.crumb, "Getting a Yahoo session token")).split(/\s+/)[0];
  const qs = RS.jsonOf(await page(RS.Y.summary(t, crumb), "Quote, consensus estimates, price targets, ratings")).quoteSummary;
  if (!qs || !qs.result || !qs.result[0]) throw { code: "bad_ticker" };
  const summary = qs.result[0];
  const annual = RS.series(RS.jsonOf(await page(RS.Y.timeseries(t, "annual"), "Annual income statement, balance sheet, cash flow")).timeseries.result);
  const quarterly = RS.series(RS.jsonOf(await page(RS.Y.timeseries(t, "quarterly"), "Quarterly statements")).timeseries.result);
  const stock = RS.closes(RS.jsonOf(await page(RS.Y.chart(t, "2y"), `Two years of daily prices for ${t}`)).chart.result[0]);
  const index = RS.closes(RS.jsonOf(await page(RS.Y.chart("^GSPC", "2y"), "Two years of daily S&P 500 prices")).chart.result[0]);
  const tnx = RS.jsonOf(await page(RS.Y.chart("^TNX", "5d"), "10-year Treasury yield")).chart.result[0].meta.regularMarketPrice;
  let peers = peerList;
  if (!peers.length) {
    try { peers = (RS.jsonOf(await page(RS.Y.recs(t), "Related tickers")).finance.result[0].recommendedSymbols || []).map((x) => x.symbol).slice(0, 6); }
    catch (e) { peers = []; }
  }
  const peerData = {};
  for (const p of peers) {
    try {
      const r = RS.jsonOf(await page(RS.Y.peerSummary(p, crumb), `Peer ${p}`)).quoteSummary;
      peerData[p] = r && r.result ? r.result[0] : null;
      if (!peerData[p]) logLine(`  ${p}: no data, skipped`, "err");
    } catch (e) { logLine(`  ${p}: ${e.message || e.code}`, "err"); }
  }
  logLine("Building the model from the feeds…");
  const inp = RS.build({ ticker: t, summary, annual, quarterly, stock, index, tnx, peers: peerData, today: new Date().toISOString().slice(0, 10) }, M);
  if (inp.market.price == null || !inp.rev_y0) throw { code: "bad_ticker" };
  M.dcf(inp, inp.scenarios.Base);        // throws on an impossible setup (e.g. g ≥ WACC)
  return inp;
}

function auditRows() {
  const P = S.inp.provenance || {};
  const base = M.dcf(S.inp, S.inp.scenarios[S.scen]).perShare;
  const rows = [];
  for (const [path, [kind, source]] of Object.entries(P)) {
    let v; try { v = get(S.inp, path); } catch (e) { continue; }
    if (typeof v !== "number") continue;
    if (path.startsWith("scenarios.") && !path.startsWith(`scenarios.${S.scen}.`)) continue;
    let impact = null;
    if (!(path === "capital.beta_custom" && S.inp.capital.beta_source !== "custom")) {
      try {
        const I = M.clone(S.inp); const bump = Math.abs(v) < 1 ? v + 0.01 : v * 1.1; set(I, path, bump);
        impact = M.dcf(I, I.scenarios[S.scen]).perShare - base;
      } catch (e) { impact = null; }
    }
    rows.push({ path, v, kind, source, impact, step: Math.abs(v) < 1 ? "+1pp" : "+10%" });
  }
  return rows;
}

const multName = { pe_fwd: "Forward P/E", pb: "Price / book", div_yield: "Dividend yield", ev_ebitda: "EV / EBITDA (TTM)", ev_sales: "EV / Sales (TTM)" };
const multFmt = (k, x) => (k === "div_yield" ? pct(x, 2) : mx(x));

function finFfItems(R) {
  const I = S.inp, c = I.consensus.targets, m = I.market, sc = R.scen3, rt = R.rel.table, k = R.W.ke, scen = I.scenarios[S.scen];
  const g = M.sensitivity(I, scen, "wacc", [k - 0.01, k + 0.01], "g", [I.terminal.g - 0.005, I.terminal.g + 0.005]).flat().filter(isFinite);
  const out = [
    { label: "52-week range", lo: m.low_52w, hi: m.high_52w, color: "#4b525c" },
    { label: "Street targets (low–high)", lo: c.low, hi: c.high, color: "#6b5a2a" },
    { label: `${short()} bear–bull`, lo: sc.Bear.perShare, hi: sc.Bull.perShare, color: "#2f6db3" },
    { label: `${short()} Ke ±1pp, g ±0.5pp`, lo: Math.min(...g), hi: Math.max(...g), color: "#2f6db3" },
  ];
  if (isER()) {
    const r = [-0.02, 0.02].map((d) => M.valueAt(I, scen, "roe_lr", scen.roe[1] + d));
    out.push({ label: "Long-run ROE ±2pp", lo: Math.min(...r), hi: Math.max(...r), color: "#2f6db3" });
  } else {
    const r = [-0.01, 0.01].map((d) => M.valueAt(I, scen, "dps_shift", d));
    out.push({ label: "Dividend growth ±1pp", lo: Math.min(...r), hi: Math.max(...r), color: "#2f6db3" });
  }
  out.push({ label: "Monte Carlo p10–p90", lo: R.mc.p10, hi: R.mc.p90, color: "#2a7f62" });
  for (const key of Object.keys(rt)) if (rt[key].usable) {
    const a = rt[key].impliedQ1, b = rt[key].impliedQ3;
    out.push({ label: `Comps ${multName[key]} (IQR)`, lo: Math.min(a, b), hi: Math.max(a, b), color: "#7a4fb3" });
  }
  if (isER() && isFinite(R.reg.implied)) {
    const bv = I.fin.bv0 / M.dilutedShares(I), v = [-0.02, 0.02].map((d) => (R.reg.a + R.reg.b * (I.fin.roe_ttm + d)) * bv);
    out.push({ label: "P/B–ROE regression ±2pp ROE", lo: Math.min(...v), hi: Math.max(...v), color: "#7a4fb3" });
  }
  return out.filter((d) => isFinite(d.lo) && isFinite(d.hi));
}

FINR.DES = (R) => {
  const I = S.inp, v = R.ver, b = R.base, sc = R.scen3, c = I.consensus.targets, vw = I.verdict.weights, m = I.market;
  const chip = v.call === "OVERVALUED" ? "over" : v.call === "UNDERVALUED" ? "under" : "fair";
  const wts = Object.entries(I.relative.weights).filter(([, w]) => w > 0);
  const methods = [
    [`${short()} — Bear`, sc.Bear.perShare, ""], [`${short()} — Base`, sc.Base.perShare, ""], [`${short()} — Bull`, sc.Bull.perShare, ""],
    ["Monte Carlo median", R.mc.median, `p10 ${px(R.mc.p10)} · p90 ${px(R.mc.p90)}`],
    [`Comps blend (${wts.map(([k]) => multName[k]).join(" · ")})`, R.rel.blended, wts.map(([, w]) => pct(w, 0)).join("/")],
  ];
  if (isER()) methods.push(["P/B–ROE regression", R.reg.implied, isFinite(R.reg.r2) ? `R² ${R.reg.r2.toFixed(2)}, n=${R.reg.n}` : `n=${R.reg.n} (too few peers)`]);
  methods.push(["Street median target (12m)", c.median, `${c.n} analysts`]);
  const bvps = I.fin.bv0 / M.dilutedShares(I);
  const revRows = isER() ? `
        <tr><td>Cost of equity</td><td>${pct(R.W.ke, 2)}</td><td>${pct(R.rev.ke, 2)}</td><td>${spct(R.rev.ke - R.W.ke, 2)}</td></tr>
        <tr><td>Long-run ROE (from ${Y(4)})</td><td>${pct(I.scenarios[S.scen].roe[1], 1)}</td><td>${pct(R.rev.roe, 1)}</td><td>${spct(R.rev.roe - I.scenarios[S.scen].roe[1], 1)}</td></tr>
        <tr><td>Share of the ROE spread kept forever</td><td>${pct(I.terminal.er_persistence ?? 1, 0)}</td><td>${isFinite(R.rev.persist) ? pct(R.rev.persist, 0) : "not reachable in 0–100%"}</td><td></td></tr>
        <tr><td>Terminal growth</td><td>${pct(I.terminal.g, 2)}</td><td>${isFinite(R.rev.g) ? pct(R.rev.g, 2) : "not reachable below Ke"}</td><td></td></tr>`
    : `
        <tr><td>Cost of equity</td><td>${pct(R.W.ke, 2)}</td><td>${pct(R.rev.ke, 2)}</td><td>${spct(R.rev.ke - R.W.ke, 2)}</td></tr>
        <tr><td>Dividend growth ${Y(0)}–${Y(3)} (shift)</td><td>${I.scenarios[S.scen].dps_growth.map((x) => pct(x, 1)).join(" · ")}</td><td>${spct(R.rev.dps, 2)} each year</td><td></td></tr>
        <tr><td>Terminal growth</td><td>${pct(I.terminal.g, 2)}</td><td>${isFinite(R.rev.g) ? pct(R.rev.g, 2) : "not reachable below Ke"}</td><td></td></tr>`;
  return `
  <div class="title"><h1>DES · ${I.meta.name} — valuation summary</h1><div class="sub">${finModelPicker()} · ${I.meta.industry || ""} · scenario ${S.scen} · valuation date ${I.meta.valuation_date}</div></div>
  <div class="grid">
    <section class="box c5">
      <h2>Verdict <span>weights: ${short()} ${pct(vw.dcf, 0)} · MC ${pct(vw.mc, 0)} · comps ${pct(vw.comps, 0)} · regression ${pct(vw.regression, 0)}</span></h2>
      <div class="verdict">
        <div><div class="k">Fair value / share</div><div class="big">${px(v.fair)}</div></div>
        <div><div class="k">vs price ${px(m.price)}</div><div class="big ${cls(v.upside)}">${spct(v.upside)}</div></div>
        <div><div class="k">Call</div><div style="margin-top:6px"><span class="chip ${chip}" style="font-size:15px">${v.call}</span></div></div>
      </div>
      <div class="kv" style="margin-top:12px">
        <span>Expected 1-year return (convergence + ${pct(v.divYield, 2)} dividend)</span><span class="${cls(v.expectedReturn)}">${spct(v.expectedReturn)}</span>
        <span>Required return (CAPM Ke)</span><span>${pct(v.requiredReturn, 2)}</span>
        <span><b class="amb">Expected alpha</b> = expected − required</span><span class="${cls(v.alpha)}"><b>${spct(v.alpha)}</b></span>
        <span>P(intrinsic value &gt; price), Monte Carlo</span><span>${pct(R.mc.probAbove)}</span>
        ${isER() ? `<span>Price / book · justified P/B (${S.scen})</span><span>${mx(m.price / bvps)} · ${mx(b.justifiedPB)}</span>
        <span>Trailing ROE vs cost of equity</span><span class="${cls(I.fin.roe_ttm - R.W.ke)}">${pct(I.fin.roe_ttm, 1)} vs ${pct(R.W.ke, 1)}</span>`
        : `<span>Dividend yield · yield the ${S.scen} value implies</span><span>${pct(I.fin.dps0 / m.price, 2)} · ${pct(b.impliedYield, 2)}</span>
        <span>(Net income + D&A) ÷ dividends</span><span class="${I.fin.dividend_cover != null && I.fin.dividend_cover < 1 ? "down" : ""}">${I.fin.dividend_cover != null ? mx(I.fin.dividend_cover) : "—"}</span>`}
      </div>
      <p class="note" style="margin-top:10px">${isER()
        ? "Banks and insurers are valued on equity: their debt is raw material, so free cash flow to the firm and WACC do not apply. Value = book equity + present value of future earnings above the cost of equity."
        : "REITs pay out most of their earnings by law, so the dividend is the cash the shareholder gets. Value = present value of dividends at the cost of equity."}</p>
    </section>
    <section class="box c7">
      <h2>What ${px(m.price)} implies <span>reverse ${short()}, ${S.scen} case, each solved alone</span></h2>
      <table><thead><tr><th>Lever</th><th>Model</th><th>Needed to justify price</th><th>Gap</th></tr></thead><tbody>${revRows}</tbody></table>
      <p class="note">Street median ${px(c.median)} is ${mx(c.median / I.consensus.eps[Y(1)])} ${Y(1)} consensus EPS${isER() ? ` and ${mx(c.median / bvps)} today's book per share (${px(bvps)})` : ""}.</p>
    </section>
    <section class="box c6">
      <h2>Value by method <span>$ per share</span></h2>
      <table><thead><tr><th>Method</th><th>Value</th><th>vs price</th><th>Detail</th></tr></thead><tbody>
      ${methods.map(([n, x, d]) => `<tr><td>${n}</td><td>${px(x)}</td><td class="${cls(x / m.price - 1)}">${spct(x / m.price - 1)}</td><td class="mut">${d}</td></tr>`).join("")}
      <tr class="sum hl"><td>Blended fair value</td><td>${px(v.fair)}</td><td class="${cls(v.upside)}">${spct(v.upside)}</td><td class="mut">${v.call}</td></tr>
      </tbody></table>
    </section>
    <section class="box c6"><h2>Price vs fair value <span>daily close, last 4 months</span></h2><div class="chart"><canvas id="cPrice"></canvas></div>
      <div class="legend"><span><i style="background:#e9e7e2"></i>Close</span><span><i style="background:#ffa028"></i>Model fair value</span><span><i style="background:#6b5a2a"></i>Street median</span></div></section>
    <section class="box"><h2>Football field <span>full view in FFLD</span></h2><div class="chart"><canvas id="cFF"></canvas></div></section>
  </div>`;
};
FINR.DES.after = (R) => RENDER.DES.after(R);

FINR.MODEL = (R) => {
  const I = S.inp, sk = S.scen, sp = `scenarios.${sk}`, rows = R.base.rows;
  const col = (f) => rows.map((r) => `<td>${f(r)}</td>`).join("");
  if (isER()) return `
  <div class="title"><h1>MODEL · ROE and book value — ${sk} case</h1><div class="sub">Yellow fields are editable · book grows by retained earnings: ROE × (1 − payout)</div></div>
  <div class="grid">
    <section class="box c5"><h2>Drivers</h2><div class="kv">
      <span>Book equity at ${I.fin.bv_date || I.meta.balance_sheet_date}, $m</span><span>${fld("fin.bv0", "num", "w", 0)}</span>
      <span>Tangible book, $m</span><span>${f0(I.fin.tbv0)}</span>
      <span>ROE ${Y(0)}</span><span>${fld(`${sp}.roe.0`, "pct", "", 1)}</span>
      <span>Long-run ROE (${Y(4)} onwards)</span><span>${fld(`${sp}.roe.1`, "pct", "", 1)}</span>
      <span>Payout (dividends + buybacks) ÷ earnings</span><span>${fld("fin.payout", "pct", "", 1)}</span>
      <span>Implied book growth, long run</span><span>${pct(I.scenarios[sk].roe[1] * (1 - I.fin.payout), 1)}</span>
      <span>Trailing ROE / annual history</span><span>${pct(I.fin.roe_ttm, 1)} / ${(I.fin.roe_hist || []).map((x) => pct(x, 1)).join(" · ")}</span></div>
      <p class="note">${(I.notes && I.notes.operating) || ""}</p></section>
    <section class="box c7"><h2>ROE path <span>${sk}</span></h2><div class="chart"><canvas id="cROE"></canvas></div></section>
    <section class="box"><h2>Projection <span>$m · ${sk}</span></h2><div class="scroll"><table>
      <thead><tr><th></th>${rows.map((r) => `<th>${r.label}</th>`).join("")}</tr></thead><tbody>
      <tr><td>Opening book equity</td>${col((r) => f0(r.bvBegin))}</tr>
      <tr><td>ROE</td>${col((r) => pct(r.roe))}</tr>
      <tr><td>Net income to common</td>${col((r) => f0(r.ni))}</tr>
      <tr><td>− Equity charge (Ke × opening book)</td>${col((r) => f0(-r.charge))}</tr>
      <tr class="sum hl"><td>Excess return</td>${col((r) => f0(r.er))}</tr>
      <tr><td>− Dividends and buybacks</td>${col((r) => f0(-r.dist))}</tr>
      <tr class="sum"><td>Closing book equity</td>${col((r) => f0(r.bvEnd))}</tr>
      <tr><td>EPS (full-year rate)</td>${col((r) => f2(r.epsAdj))}</tr><tr><td>Book per share</td>${col((r) => f2(r.bvps))}</tr>
      </tbody></table></div><p class="note">${rows[0].label} counts ${pct(rows[0].frac, 0)} of a year: the part after the ${I.fin.bv_date || I.meta.balance_sheet_date} balance sheet.</p></section>
  </div>`;
  return `
  <div class="title"><h1>MODEL · Dividends — ${sk} case</h1><div class="sub">Yellow fields are editable · ${Y(4)}–${Y(9)} growth fades to terminal g</div></div>
  <div class="grid">
    <section class="box c5"><h2>Drivers</h2><div class="kv">
      <span>Dividend per share now (annualised)</span><span>${fld("fin.dps0", "num", "", 2)}</span>
      ${[0, 1, 2, 3].map((k) => `<span>Dividend growth ${Y(k)}</span><span>${fld(`${sp}.dps_growth.${k}`, "pct", "", 1)}</span>`).join("")}
      <span>Terminal growth</span><span>${fld("terminal.g")}</span>
      <span>Dividend per share history</span><span>${(I.fin.dps_hist || []).map(([d, x]) => d.slice(0, 4) + " " + f2(x)).join(" · ")}</span>
      <span>(Net income + D&A) ÷ dividends</span><span>${I.fin.dividend_cover != null ? mx(I.fin.dividend_cover) : "—"}</span></div>
      <p class="note">${(I.notes && I.notes.operating) || ""}</p></section>
    <section class="box c7"><h2>Dividend path <span>$ per share</span></h2><div class="chart"><canvas id="cROE"></canvas></div></section>
    <section class="box"><h2>Projection <span>$ per share · ${sk}</span></h2><div class="scroll"><table>
      <thead><tr><th></th>${rows.map((r) => `<th>${r.label}</th>`).join("")}</tr></thead><tbody>
      <tr><td>Growth</td>${col((r) => pct(r.g))}</tr><tr class="sum"><td>Dividend per share</td>${col((r) => f2(r.dps))}</tr>
      <tr><td>Share still to be paid</td>${col((r) => pct(r.frac, 0))}</tr><tr><td>Discount factor</td>${col((r) => r.df.toFixed(4))}</tr>
      <tr class="sum hl"><td>Present value</td>${col((r) => f2(r.pv))}</tr></tbody></table></div></section>
  </div>`;
};
FINR.MODEL.after = (R) => {
  const rows = R.base.rows;
  chart("cROE", { type: isER() ? "line" : "bar", data: { labels: rows.map((r) => r.label), datasets: isER()
    ? [{ label: "ROE", data: rows.map((r) => r.roe * 100), borderColor: "#ffa028", pointRadius: 3 }, { label: "Cost of equity", data: rows.map(() => R.W.ke * 100), borderColor: "#8b9099", borderDash: [5, 4], pointRadius: 0 }]
    : [{ label: "Dividend per share", data: rows.map((r) => r.dps), backgroundColor: "#2f6db3" }] },
    options: { plugins: { legend: { labels: { boxWidth: 10 } } }, scales: { y: { ticks: { callback: (v) => isER() ? v + "%" : "$" + v } } } } });
};

FINR.VAL = (R) => {
  const I = S.inp, b = R.base, rows = b.rows, W = R.W, m = I.market, sh = M.dilutedShares(I), mcapNow = m.price * sh;
  const a = I.history.annual;
  const cell = (x, f) => `<td>${x == null || !isFinite(x) ? '<span class="mut">n/a</span>' : f(x)}</td>`;
  const step2 = `<section class="box c4"><h2>2 · Discount rate (cost of equity)</h2><div class="kv">
      <span>10-year Treasury (rf)</span><span>${pct(I.capital.rf, 2)}</span>
      <span>Market return (Rm)</span><span>${pct(W.rm, 2)}</span>
      <span>Market risk premium (Rm − rf)</span><span>${pct(W.mrp, 2)}</span>
      <span>Beta (${I.capital.beta_source.replace("_", " ")})</span><span>${W.beta.chosen.toFixed(3)}</span>
      <span><b class="amb">Cost of equity</b> = rf + β × MRP</span><span><b>${pct(W.ke, 2)}</b></span></div>
      <p class="note">No WACC: for a ${isER() ? "bank or insurer" : "REIT valued on dividends"} the cash flows are already after interest, so they are discounted at the cost of equity.</p></section>`;
  if (isER()) return `
  <div class="title"><h1>VAL · Valuation in five steps — ${S.scen}</h1><div class="sub">History → excess returns → cost of equity → discount → equity value → price</div></div>
  <div class="grid">
    <section class="box"><h2>1 · Historic performance and future earnings <span>$m</span></h2><div class="scroll"><table>
      <thead><tr><th></th>${a.labels.map((l) => `<th>${l}A</th>`).join("")}${rows.map((r) => `<th>${r.label}E</th>`).join("")}</tr></thead><tbody>
      <tr><td>Net income</td>${a.net_income.map((x) => cell(x, f0)).join("")}${rows.map((r) => cell(r.ni / r.frac, f0)).join("")}</tr>
      <tr><td>ROE</td>${a.labels.map((_, i) => cell(i ? (I.fin.roe_hist || [])[i - 1] : null, (x) => pct(x))).join("")}${rows.map((r) => cell(r.roe, (x) => pct(x))).join("")}</tr>
      <tr><td>Book equity (closing)</td>${a.labels.map(() => cell(null)).join("")}${rows.map((r) => cell(r.bvEnd, f0)).join("")}</tr>
      <tr class="sum hl"><td>Excess return (full-year rate)</td>${a.labels.map(() => cell(null)).join("")}${rows.map((r) => cell(r.er / r.frac, f0)).join("")}</tr>
      </tbody></table></div><p class="note">Excess return = net income − cost of equity × opening book. Drivers in <a href="#MODEL" data-tab="MODEL">MODEL</a>.</p></section>
    ${step2}
    <section class="box c8"><h2>3 · Discount the excess returns <span>PV = excess return ÷ (1 + Ke)^t</span></h2><div class="scroll"><table>
      <thead><tr><th></th>${rows.map((r) => `<th>${r.label}</th>`).join("")}<th>Terminal</th></tr></thead><tbody>
      <tr><td>Excess return counted</td>${rows.map((r) => `<td>${f0(r.er)}</td>`).join("")}<td>${f0(b.tv)}</td></tr>
      <tr><td>Years from today (t)</td>${rows.map((r) => `<td>${r.t.toFixed(2)}</td>`).join("")}<td></td></tr>
      <tr><td>Discount factor</td>${rows.map((r) => `<td>${r.df.toFixed(4)}</td>`).join("")}<td>${(b.pvTV / b.tv).toFixed(4)}</td></tr>
      <tr class="sum"><td>Present value</td>${rows.map((r) => `<td>${f0(r.pv)}</td>`).join("")}<td>${f0(b.pvTV)}</td></tr></tbody></table></div>
      <p class="note">Terminal: ROE of ${pct(b.roeTerminal, 1)} forever (Ke + ${pct(I.terminal.er_persistence ?? 1, 0)} of the long-run spread), book growing at ${pct(I.terminal.g, 1)}.</p></section>
    <section class="box c6"><h2>4 · Equity value <span>no debt bridge: debt is part of the business</span></h2><div class="kv">
      <span>Book equity today</span><span>${f0(b.bv0)}</span>
      <span>+ PV of excess returns ${rows[0].label}–${rows[rows.length - 1].label}</span><span>${f0(b.pvExplicit)}</span>
      <span>+ PV of terminal excess return</span><span>${f0(b.pvTV)}</span>
      <span><b class="amb">= Estimated market cap (equity value)</b></span><span><b>${f0(b.equity)}</b></span>
      <span>Current market cap</span><span>${f0(mcapNow)}</span>
      <span>Difference</span><span class="${cls(b.equity / mcapNow - 1)}">${spct(b.equity / mcapNow - 1)}</span></div></section>
    <section class="box c6"><h2>5 · Market cap → fair share price</h2><div class="kv">
      <span>Estimated market cap</span><span>${f0(b.equity)}</span><span>÷ Diluted shares (m)</span><span>${f2(sh)}</span>
      <span><b class="amb">= Fair share price (${S.scen})</b></span><span class="big amb">${px(b.perShare)}</span>
      <span>Current share price</span><span>${px(m.price)}</span>
      <span>Upside / (downside)</span><span class="${cls(b.perShare / m.price - 1)}"><b>${spct(b.perShare / m.price - 1)}</b></span></div>
      <p class="note">The DES summary blends this with Monte Carlo, comps and the P/B–ROE regression (${px(R.ver.fair)}, ${R.ver.call.toLowerCase()}).</p></section>
  </div>`;
  return `
  <div class="title"><h1>VAL · Valuation in five steps — ${S.scen}</h1><div class="sub">Dividend history → dividends → cost of equity → discount → price</div></div>
  <div class="grid">
    <section class="box"><h2>1 · Dividend history and forecast <span>$ per share</span></h2><div class="scroll"><table>
      <thead><tr><th></th>${(I.fin.dps_hist || []).map(([d]) => `<th>${d.slice(0, 4)}A</th>`).join("")}${rows.map((r) => `<th>${r.label}E</th>`).join("")}</tr></thead><tbody>
      <tr class="sum hl"><td>Dividend per share</td>${(I.fin.dps_hist || []).map(([, x]) => cell(x, f2)).join("")}${rows.map((r) => cell(r.dps, f2)).join("")}</tr>
      <tr><td>Growth</td>${(I.fin.dps_hist || []).map(([, x], i, h) => cell(i ? x / h[i - 1][1] - 1 : null, (y) => pct(y))).join("")}${rows.map((r) => cell(r.g, (y) => pct(y))).join("")}</tr>
      </tbody></table></div><p class="note">History is cash dividends ÷ diluted shares from the annual statements; the current rate (${px(I.fin.dps0)}) is the declared annualised dividend.</p></section>
    ${step2}
    <section class="box c8"><h2>3 · Discount the dividends <span>PV = dividend ÷ (1 + Ke)^t</span></h2><div class="scroll"><table>
      <thead><tr><th></th>${rows.map((r) => `<th>${r.label}</th>`).join("")}<th>Terminal</th></tr></thead><tbody>
      <tr><td>Dividend counted</td>${rows.map((r) => `<td>${f2(r.paid)}</td>`).join("")}<td>${f2(b.tv)}</td></tr>
      <tr><td>Discount factor</td>${rows.map((r) => `<td>${r.df.toFixed(4)}</td>`).join("")}<td>${(b.pvTV / b.tv).toFixed(4)}</td></tr>
      <tr class="sum"><td>Present value</td>${rows.map((r) => `<td>${f2(r.pv)}</td>`).join("")}<td>${f2(b.pvTV)}</td></tr></tbody></table></div></section>
    <section class="box c6"><h2>4–5 · Fair share price</h2><div class="kv">
      <span>PV of dividends ${rows[0].label}–${rows[rows.length - 1].label}</span><span>${px(b.pvExplicit)}</span>
      <span>+ PV of terminal value (g ${pct(I.terminal.g, 1)})</span><span>${px(b.pvTV)}</span>
      <span><b class="amb">= Fair share price (${S.scen})</b></span><span class="big amb">${px(b.perShare)}</span>
      <span>× Diluted shares = equity value, $m</span><span>${f0(b.equity)} <span class="mut">vs ${f0(mcapNow)} today</span></span>
      <span>Upside / (downside)</span><span class="${cls(b.perShare / m.price - 1)}"><b>${spct(b.perShare / m.price - 1)}</b></span></div></section>
  </div>`;
};

FINR.DCF = (R) => {
  const I = S.inp, b = R.base, rows = b.rows, m = I.market, bvps = I.fin.bv0 / M.dilutedShares(I);
  return `
  <div class="title"><h1>DCF · ${finName()} — ${S.scen}</h1><div class="sub">${I.timing.mid_year ? "Mid-year convention" : "Year-end discounting"} · discount rate = cost of equity ${pct(b.ke, 2)}</div></div>
  <div class="grid">
    <section class="box c4"><h2>Terminal value</h2><div class="kv">
      <span>Terminal growth g</span><span>${fld("terminal.g")}</span>
      ${isER() ? `<span>Share of long-run ROE spread kept forever</span><span>${fld("terminal.er_persistence", "pct", "", 0)}</span>
      <span>Terminal ROE</span><span>${pct(b.roeTerminal, 2)}</span>
      <span>Terminal excess return, $m</span><span>${f0(b.tv * (b.ke - I.terminal.g))}</span>` : `<span>Terminal dividend × (1+g) ÷ (Ke − g)</span><span>${px(b.tv)}</span>`}
      <span>PV of terminal value</span><span>${isER() ? f0(b.pvTV) : px(b.pvTV)}</span>
      <span>Terminal share of value</span><span>${pct(b.tvShare)}</span></div>
      <p class="note">${isER() ? "Competition erodes excess returns: 100% keeps the long-run ROE forever, 0% lets it fall to the cost of equity at the horizon." : "Gordon growth on the year-10 dividend. Terminal g above long-run inflation plus real growth is hard to defend."}</p></section>
    <section class="box c4"><h2>Equity value <span>$m</span></h2><div class="kv">
      ${isER() ? `<span>Book equity</span><span>${f0(b.bv0)}</span><span>+ PV excess returns</span><span>${f0(b.pvExplicit)}</span><span>+ PV terminal</span><span>${f0(b.pvTV)}</span>`

// ---------------------------------------------------------------- fail-closed screens
// Numeric paths can be fixed in place; other items explain what to change.
function fixField(path) {
  const v = get(S.inp, path);
  if (path.startsWith("meta.") || path.startsWith("peers.") || path === "capital.beta_source" || path.startsWith("verdict.weights")) return "";
  const pctLike = /(^capital\.(rf|rm|erp|kd_pretax|tax_marginal)$)|(^operating\.)|(^terminal\.(g|ronic|er_persistence)$)|(^scenarios\.)|(^fin\.payout$)/.test(path);
  if (v !== undefined || /^(bridge|market|capital|operating|terminal|scenarios|y1_segments|rev_y0|fin)/.test(path)) return fld(path, pctLike ? "pct" : "num", "w");
  return "";
}
function notValued(Q) {
  const li = Q.blocking.map((b) => `<li><b>${b.msg}</b> <span class="mut">[${b.path}]</span> ${fixField(b.path)}</li>`).join("");
  const wl = Q.warnings.map((w) => `<li>${w.msg} <span class="mut">[${w.path}]</span></li>`).join("");
  return `<div class="title"><h1>NOT VALUED · ${S.inp.meta.ticker}</h1><div class="sub">The tool will not give a fair value until these inputs are fixed</div></div>
  <div class="dq blk"><h2>Blocking (${Q.blocking.length})</h2><ul>${li}</ul>
  <p class="note">A missing figure is never treated as zero. Enter it from the latest 10-Q or 10-K and the valuation runs again. LOAD and SRC stay open.</p></div>
  ${wl ? `<div class="dq"><h2>Warnings (${Q.warnings.length})</h2><ul>${wl}</ul></div>` : ""}`;
}
function dqStrip(W) {
  if (!W || !W.length) return "";
  return `<details class="dq"><summary>${W.length} data warning${W.length > 1 ? "s" : ""}: fallbacks and gaps in the inputs</summary><ul>${
    W.map((w) => `<li>${w.msg} <span class="mut">[${w.path}]</span></li>`).join("")}</ul></details>`;
}

// ---------------------------------------------------------------- render loop
function render() {
  let R;
  try { R = compute(); } catch (e) {
    $("main").innerHTML = `<div class="box"><h2>Input error</h2><p class="note">${e.message}. Undo the last change or press Reset inputs.</p></div>`; return;
  }
  renderHeader(R);
  for (const id of Object.keys(S.charts)) { S.charts[id].destroy(); delete S.charts[id]; }
  if (R.blocked && !["LOAD", "SRC"].includes(S.tab)) { $("main").innerHTML = notValued(R.blocked); return; }
  const RD = (M.isFin(S.inp) && FINR[S.tab]) || RENDER[S.tab];
  $("main").innerHTML = (R.checks ? dqStrip(R.ver.warnings) : "") + RD(R);
  if (RD.after) RD.after(R);
  $("foot").innerHTML = `${S.inp.meta.name} · ${S.inp.meta.units} · Prices ${S.inp.meta.price_date} close · Fundamentals to ${S.inp.meta.balance_sheet_date} · Not investment advice.`;
}

function go(tab) {
  if (!TABS.some((t) => t[0] === tab)) return false;
  S.tab = tab; try { localStorage.setItem("vt_tab_DELL", tab); } catch (e) {}
  try { history.replaceState(null, "", "#" + tab); } catch (e) {}
  render(); try { window.scrollTo(0, 0); } catch (e) {} return true;
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]"); if (t) { go(t.dataset.tab); return; }
  const s = e.target.closest("[data-scen]"); if (s) { S.scen = s.dataset.scen; render(); }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.matches("input.f[data-p]")) {
    const raw = parseFloat(el.value); if (!isFinite(raw)) { render(); return; }
    set(S.inp, el.dataset.p, el.dataset.k === "pct" ? raw / 100 : raw); render();
  }
  else if (el.id === "coSel") { switchCompany(el.value); }
  else if (el.id === "finModel") { switchFinModel(el.value); }
  else if (el.id === "eqGate") { S.inp.verdict.quality_gate = el.value === "on"; render(); }
  else if (el.id === "betaSrc") { S.inp.capital.beta_source = el.value; render(); }
  else if (el.id === "tvMethod") { S.inp.terminal.method = el.value; render(); }
  else if (el.id === "relStat") { S.inp.relative.stat = el.value; render(); }
  else if (el.matches("[data-peer]")) {
    const tk = el.dataset.peer, cs = S.inp.peers.core_set;
    if (el.checked && !cs.includes(tk)) cs.push(tk);
    if (!el.checked) { if (cs.length <= 2) { el.checked = true; return; } cs.splice(cs.indexOf(tk), 1); }
    render();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.matches("input.f[data-p]")) e.target.dispatchEvent(new Event("change", { bubbles: true }));
});
$("cmdForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const words = $("cmdInput").value.toUpperCase().replace(/<GO>/g, "").split(/\s+/).filter(Boolean);
  const hit = words.reverse().find((w) => TABS.some((t) => t[0] === w));
  if (hit) { go(hit); $("cmdInput").value = ""; return; }
  const tk = words.reverse().find((w) => /^[A-Z][A-Z0-9.\-]{0,9}$/.test(w) && !["US", "EQUITY", "GO"].includes(w));
  if (tk) { if (companyData(tk)) { switchCompany(tk); } else { LOADSTATE.ticker = tk; go("LOAD"); } $("cmdInput").value = ""; return; }
  $("cmdInput").value = "UNKNOWN FUNCTION — TRY " + TABS.map((t) => t[0]).join(" ") + " OR A TICKER";
});
$("resetBtn").addEventListener("click", () => { S.inp = M.clone(companyData(CO.active) || DATA); render(); });
function switchCompany(t) {
  const d = companyData(t); if (!d) return;
  CO.active = t; saveCompanies(); S.inp = M.clone(d); S.mcKey = ""; S.scen = "Base"; go(S.tab === "LOAD" ? "DES" : S.tab);
}
render();
</script>
