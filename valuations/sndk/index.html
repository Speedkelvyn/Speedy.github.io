    <style>
      /* Layout: terminal shell — command line, function-key row, quote strip, one function panel at a time (Bloomberg-style). Deliberately single dark look. */
      :root {
        color-scheme: dark;
        --bg: #08090b; /* screen */
        --panel: #101216; /* function panel */
        --panel-2: #161a1f; /* table header / hover */
        --rule: #262b33; /* grid lines */
        --amber: #ffa028; /* labels, function codes */
        --amber-dim: #a8691c;
        --text: #e9e7e2; /* values */
        --muted: #8b9099;
        --input: #f6c344; /* editable fields (yellow, as on the terminal) */
        --input-bg: #1d1a10;
        --blue: #4aa3ff; /* headers / links */
        --up: #3ddc84;
        --down: #ff4d4d;
        --warn: #ffcc4d;
        --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        --cond: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--bg);
        color: var(--text);
      }
      body {
        font: 13px/1.45 var(--mono);
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 12px 40px;
        font-variant-numeric: tabular-nums;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--bg);
      }
      a {
        color: var(--blue);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 1px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }

      /* ---- command line ---- */
      .cmd {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 8px;
      }
      .cmd .brand {
        font: 600 12px var(--cond);
        letter-spacing: 0.14em;
        color: var(--amber);
        text-transform: uppercase;
      }
      .cmd form {
        display: flex;
        flex: 1 1 260px;
        min-width: 0;
      }
      .cmd input {
        flex: 1;
        min-width: 0;
        background: var(--input-bg);
        border: 1px solid var(--amber-dim);
        border-right: 0;
        padding: 5px 8px;
        color: var(--input);
        text-transform: uppercase;
      }
      .cmd button.go {
        background: #2b6e2b;
        border: 1px solid #3f9a3f;
        color: #fff;
        padding: 5px 10px;
        font-weight: 600;
        cursor: pointer;
      }
      .cmd .asof {
        color: var(--muted);
        font-size: 11px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--rule);
      }
      .seg button {
        background: none;
        border: 0;
        padding: 4px 10px;
        color: var(--muted);
        cursor: pointer;
        font: 500 12px var(--cond);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .seg button[aria-pressed="true"] {
        background: var(--amber);
        color: #000;
      }
      .btn {
        background: var(--panel-2);
        border: 1px solid var(--rule);
        padding: 4px 10px;
        cursor: pointer;
        color: var(--text);
        font: 500 12px var(--cond);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .btn:hover {
        border-color: var(--amber-dim);
      }

      /* ---- function keys ---- */
      .fkeys {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px 0;
      }
      .fkeys button {
        background: #1a1408;
        border: 1px solid #3a2a10;
        color: var(--amber);
        padding: 4px 9px;
        cursor: pointer;
        font: 600 12px var(--mono);
      }
      .fkeys button small {
        color: var(--muted);
        font: 400 11px var(--cond);
        margin-left: 6px;
        letter-spacing: 0.03em;
      }
      .fkeys button[aria-selected="true"] {
        background: var(--amber);
        color: #000;
        border-color: var(--amber);
      }
      .fkeys button[aria-selected="true"] small {
        color: #3a2400;
      }

      /* ---- quote strip ---- */
      .quote {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
        gap: 0;
        border: 1px solid var(--rule);
        background: var(--panel);
      }
      .quote > div {
        padding: 7px 10px;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        min-width: 0;
      }
      .quote .k {
        color: var(--amber);
        font: 500 11px var(--cond);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .quote .v {
        font-size: 16px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .quote .tkr .v {
        color: var(--text);
        font-size: 18px;
      }
      @media (min-width: 700px) {
        .quote .tkr {
          grid-column: span 2;
        }
      }
      .chip {
        display: inline-block;
        padding: 1px 8px;
        font: 700 12px var(--cond);
        letter-spacing: 0.1em;
      }
      .chip.over {
        background: var(--down);
        color: #000;
      }
      .chip.under {
        background: var(--up);
        color: #000;
      }
      .chip.fair {
        background: var(--warn);
        color: #000;
      }
      .chip.nv {
        background: var(--muted);
        color: #000;
      }
      input.f.miss {
        border-color: var(--down);
        background: rgba(255, 77, 77, 0.08);
      }
      .dq {
        border: 1px solid var(--warn);
        padding: 6px 10px;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .dq.blk {
        border-color: var(--down);
      }
      .dq summary {
        cursor: pointer;
        color: var(--warn);
      }
      .dq.blk h2 {
        color: var(--down);
      }
      .dq li {
        margin: 2px 0;
      }
      .up {
        color: var(--up);
      }
      .down {
        color: var(--down);
      }
      .mut {
        color: var(--muted);
      }
      .amb {
        color: var(--amber);
      }
      .warn {
        color: var(--warn);
      }

      /* ---- panels ---- */
      main {
        margin-top: 10px;
      }
      .title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--amber-dim);
        padding-bottom: 4px;
        margin-bottom: 10px;
      }
      .title h1 {
        margin: 0;
        font: 600 15px var(--cond);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--amber);
      }
      .title .sub {
        color: var(--muted);
        font-size: 12px;
      }
      .grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(12, minmax(0, 1fr));
      }
      .box {
        grid-column: span 12;
        background: var(--panel);
        border: 1px solid var(--rule);
        padding: 10px;
        min-width: 0;
      }
      .box h2 {
        margin: 0 0 8px;
        font: 600 12px var(--cond);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--blue);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .box h2 span {
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0.04em;
        text-transform: none;
      }
      @media (min-width: 900px) {
        .c3 {
          grid-column: span 3;
        }
        .c4 {
          grid-column: span 4;
        }
        .c5 {
          grid-column: span 5;
        }
        .c6 {
          grid-column: span 6;
        }
        .c7 {
          grid-column: span 7;
        }
        .c8 {
          grid-column: span 8;
        }
        .c9 {
          grid-column: span 9;
        }
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      th,
      td {
        padding: 3px 7px;
        text-align: right;
        white-space: nowrap;
        border-bottom: 1px solid var(--rule);
      }
      th {
        color: var(--amber);
        font: 500 11px var(--cond);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: var(--panel-2);
        position: sticky;
        top: 0;
      }
      td:first-child,
      th:first-child,
      td.l,
      th.l {
        text-align: left;
      }
      tr.sum td {
        border-top: 1px solid var(--muted);
        font-weight: 600;
      }
      tr.hl td {
        background: #1c1608;
      }
      td.lbl {
        color: var(--muted);
      }
      .kv {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        font-size: 12px;
      }
      .kv > :nth-child(odd) {
        color: var(--muted);
      }
      .kv > :nth-child(even) {
        text-align: right;
      }
      .big {
        font-size: 28px;
        font-weight: 500;
        line-height: 1.1;
      }
      .note {
        color: var(--muted);
        font-size: 11.5px;
        max-width: 75ch;
      }
      .note b {
        color: var(--text);
        font-weight: 500;
      }
      .verdict {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .verdict .k {
        color: var(--amber);
        font: 500 11px var(--cond);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .chart {
        position: relative;
        height: 260px;
      }
      .chart.tall {
        height: 340px;
      }
      .chart.short {
        height: 200px;
      }
      input.f {
        width: 72px;
        background: var(--input-bg);
        border: 0;
        border-bottom: 1px solid var(--amber-dim);
        color: var(--input);
        text-align: right;
        padding: 1px 4px;
      }
      input.f.w {
        width: 90px;
      }
      select.f {
        background: var(--input-bg);
        border: 1px solid var(--amber-dim);
        color: var(--input);
        padding: 1px 4px;
      }
      .heat td {
        color: #fff;
        font-weight: 500;
      }
      .heat td.lbl,
      .heat th {
        color: var(--amber);
      }
      .pill {
        display: inline-block;
        border: 1px solid var(--rule);
        padding: 0 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .list {
        margin: 0;
        padding-left: 18px;
      }
      .list li {
        margin: 3px 0;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 2px;
        vertical-align: middle;
        margin-right: 5px;
      }
      @media (max-width: 700px) {
        .box table {
          display: block;
          overflow-x: auto;
        }
        .big {
          font-size: 22px;
        }
      }
      .kv > * {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .box h2 {
        flex-wrap: wrap;
      }
      .pv {
        display: inline-block;
        font: 600 9px/1.4 var(--mono);
        margin-left: 3px;
        padding: 0 3px;
        border: 1px solid currentColor;
        vertical-align: 1px;
        cursor: help;
      }
      .pv.s {
        color: var(--up);
      }
      .pv.d {
        color: var(--blue);
      }
      .pv.a {
        color: var(--warn);
      }
      .pv.u {
        color: var(--muted);
      }
      .log {
        font-size: 12px;
        max-height: 260px;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--rule);
        padding: 6px 8px;
      }
      .log div {
        white-space: pre-wrap;
      }
      .log .ok {
        color: var(--up);
      }
      .log .err {
        color: var(--down);
      }
      footer {
        margin-top: 14px;
        color: var(--muted);
        font-size: 11px;
        border-top: 1px solid var(--rule);
        padding-top: 8px;
      }

      /* static hosting: let wide tables scroll inside their panel */
      main section.box {
        min-width: 0;
        overflow-x: auto;
      }
      .site-links {
        position: fixed;
        right: 14px;

        color: var(--amber);
        border: 1px solid var(--amber);
        padding: 9px 12px;
        text-decoration: none;
        border-radius: 2px;
      }

          : x.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const f2 = (x) =>
        x == null || !isFinite(x)
          ? "—"
          : x.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const px = (x) => (x == null || !isFinite(x) ? "—" : "$" + f2(x));
      const pct = (x, d = 1) => (x == null || !isFinite(x) ? "—" : (x * 100).toFixed(d) + "%");
      const spct = (x, d = 1) =>
        x == null || !isFinite(x) ? "—" : (x >= 0 ? "+" : "") + (x * 100).toFixed(d) + "%";
      const bn = (x) => (x == null || !isFinite(x) ? "—" : "$" + (x / 1000).toFixed(1) + "B");
      const mx = (x) => (x == null || !isFinite(x) ? "—" : x.toFixed(1) + "x");
      const cls = (x) => (x > 0 ? "up" : x < 0 ? "down" : "");
      const get = (o, p) => p.split(".").reduce((a, k) => a[k], o);
      const set = (o, p, v) => {
        const ks = p.split(".");
        const last = ks.pop();
        ks.reduce((a, k) => a[k], o)[last] = v;
      };

      const UI = () =>
        Object.assign({ key_segment_label: "Key segment", key_margin_label: "key margin" }, S.inp.ui || {});
      const KS = () => M.keySeg(S.inp),
        KM = () => M.keyMargin(S.inp);
      const Y = (i) => S.inp.meta.year_labels[i];
      const segName = (k) => (M.defs(S.inp).find((d) => d.key === k) || { name: k }).name;
      const mgName = (g) => (S.inp.margin_groups || {})[g] || g;
      // editable field: data-p = path in S.inp, data-k = pct | num
      function fld(path, kind = "pct", w = "", dec) {
        const v = get(S.inp, path);
        const d = dec != null ? dec : kind === "pct" ? 2 : 2;
        const miss = typeof v !== "number" || !isFinite(v);
        const shown = miss ? "" : kind === "pct" ? (v * 100).toFixed(d) : Number(v).toFixed(d);
        return `<input type="text" class="f ${w}${miss ? " miss" : ""}" data-p="${path}" placeholder="${miss ? "missing" : ""}" data-k="${kind}" value="${shown}" inputmode="decimal" aria-label="${path}">${kind === "pct" ? '<span class="mut">%</span>' : ""}${pv(path)}`;
      }
      // provenance badge: S = sourced from a filing or data feed, D = derived from sourced numbers, A = assumption
      function pv(path) {
        const p = (S.inp.provenance || {})[path];
        if (!p) return `<span class="pv u" title="No source recorded">?</span>`;
        const k = p[0] === "sourced" ? "s" : p[0] === "derived" ? "d" : "a";
        return `<span class="pv ${k}" title="${String(p[1]).replace(/"/g, "&quot;")}">${k.toUpperCase()}</span>`;
      }

      // ---------------------------------------------------------------- compute
      function compute() {
        const inp = S.inp,
          scen = inp.scenarios[S.scen];
        const Q = M.checkInputs(inp);
        if (!Q.ok) return { blocked: Q, ver: M.verdict(inp, {}) };
        const W = M.wacc(inp);
        const base = M.dcf(inp, scen);
        const scen3 = {};
        for (const k of Object.keys(inp.scenarios)) scen3[k] = M.dcf(inp, inp.scenarios[k]);
        const rel = M.relative(inp);
        const rows = base.rows;
        const sg = inp.relative && inp.relative.subject_growth;
        const egr = sg != null && isFinite(sg) ? sg : Math.pow(rows[3].epsAdj / rows[0].epsAdj, 1 / 3) - 1;
        const reg = inp.model === "ddm" ? { implied: NaN, n: 0, points: [] } : M.regression(inp, egr);
        const key = JSON.stringify([inp, S.scen]);
        if (S.mcKey !== key) {
          S.mc = M.monteCarlo(inp, scen, { n: 1500, seed: 7 });
          S.mcKey = key;
        }
        const mc = S.mc;
        const ver = M.verdict(inp, {
          dcf: base.perShare,
          mc: mc.median,
          comps: rel.blended,
          regression: reg.implied,
        });
        if (reg.weak && isFinite(reg.r2))
          (ver.warnings = ver.warnings.filter((w) => w.path !== "verdict.weights.regression")),
            ver.warnings.push({
              path: "relative.reg_min_r2",
              msg: `Peer regression R² ${reg.r2.toFixed(2)} is below ${reg.minR2.toFixed(2)}; it is shown but left out of the blend`,
            });
        const w = W.wacc;
        if (M.isFin(inp)) {
          const k = W.ke,
            rev = {
              ke: M.reverse(inp, scen, "wacc", inp.terminal.g + 0.006, 0.3),
              g: M.reverse(inp, scen, "g", -0.05, k - 0.0005),
            };
          if (inp.model === "excess_return") {
            rev.roe = M.reverse(inp, scen, "roe_lr", -0.2, 0.8);
            rev.persist = M.reverse(inp, scen, "persistence", 0, 1);
          } else rev.dps = M.reverse(inp, scen, "dps_shift", -0.3, 0.3);
          return { W, base, scen3, rel, reg, mc, ver, rev, egr, pv: M.pvgo(inp), checks: Q };
        }
        const rev = {
          wacc: M.reverse(inp, scen, "wacc", 0.04, 0.25),
          margin: M.reverse(inp, scen, "margin_shift", -0.15, 0.3),
          ai: M.reverse(inp, scen, "ai_shift", -0.6, 3),
          all: M.reverse(inp, scen, "all_growth_shift", -0.3, 0.5),
          g: M.reverse(inp, scen, "g", -0.05, w - 0.0005),
        };
        if (isFinite(rev.margin)) {
          const k = M.applyKnob(inp, scen, "margin_shift", rev.margin);
          rev.marginEbit = M.dcf(k.I, k.S).rows[4].margin;
        }
        return { W, base, scen3, rel, reg, mc, ver, rev, egr, pv: M.pvgo(inp), checks: Q };
      }

      // ---------------------------------------------------------------- header
      function renderHeader(R) {

    <div><div class="k">Street median</div><div class="v">${nz(S.inp.consensus.targets.median, px)}</div></div>`;
        else

    <div><div class="k">Mkt cap (dil.)</div><div class="v">${bn(m.price * sh)}</div></div>
    <div><div class="k">Fair value</div><div class="v">${px(v.fair)}</div></div>
    <div><div class="k">Upside</div><div class="v ${cls(v.upside)}">${spct(v.upside)}</div></div>
    <div><div class="k">Call (±${pct(S.inp.verdict.band, 0)})${v.confidence === "low" ? " · low confidence" : ""}</div><div class="v"><span class="chip ${chip}">${v.call}</span>${eqBadge}</div></div>

    ${
      M.isFin(S.inp)

        : `<div><div class="k">WACC / Ke</div><div class="v">${pct(R.W.wacc, 2)} / ${pct(R.W.ke, 2)}</div></div>`
    }
    <div><div class="k">Street median</div><div class="v">${px(S.inp.consensus.targets.median)}</div></div>`;
        $("cmdInput").placeholder =

      // ---------------------------------------------------------------- charts
      const HAS_CHART = typeof Chart !== "undefined";
      if (HAS_CHART) {

      }
      const vlines = {
        id: "vlines",
        afterDatasetsDraw(chart, _a, opts) {
          if (!opts || !opts.lines) return;
          const { ctx, chartArea: a } = chart,
            xs = chart.scales.x,
            ys = chart.scales.y;
          for (const L of opts.lines) {
            ctx.save();
            ctx.strokeStyle = L.color;
            ctx.lineWidth = L.width || 1.5;
            ctx.setLineDash(L.dash || []);
            ctx.beginPath();
            if (L.axis === "y") {
              const y = ys.getPixelForValue(L.value);
              ctx.moveTo(a.left, y);
              ctx.lineTo(a.right, y);
            } else {
              const x = xs.getPixelForValue(L.value);
              ctx.moveTo(x, a.top);
              ctx.lineTo(x, a.bottom);
            }
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = L.color;
            ctx.font = '11px "IBM Plex Mono", monospace';
            if (L.axis === "y") ctx.fillText(L.label, a.left + 4, ys.getPixelForValue(L.value) - 4);
            else
              ctx.fillText(
                L.label,
                Math.min(xs.getPixelForValue(L.value) + 4, a.right - ctx.measureText(L.label).width - 2),
                a.top + 12 + (L.row || 0) * 13,

            ctx.restore();

        },

          { responsive: true, maintainAspectRatio: false, animation: false },

        S.charts[id] = new Chart(el, cfg);
      }
      function floatBars(id, items, lines, xmin, xmax) {
        chart(id, {
          type: "bar",

              {

                borderWidth: 0,

          },

            indexAxis: "y",
            plugins: {
              legend: { display: false },

      // ---------------------------------------------------------------- tabs
      function ffItems(R) {

          scen = I.scenarios[S.scen];
        const g = M.sensitivity(I, scen, "wacc", [w - 0.01, w + 0.01], "g", [
          I.terminal.g - 0.005,
          I.terminal.g + 0.005,
        ]).flat();
        const I2 = M.clone(I);
        I2.terminal.method = "exit";
        const exits = [10, 14].map((k) => {
          const J = M.clone(I2);
          J.terminal.exit_multiple = k;
          return M.dcf(J, scen).perShare;
        });
        const regLo = M.regression(I, R.egr - 0.05).implied,
          regHi = M.regression(I, R.egr + 0.05).implied;
        return [
          { label: "52-week range", lo: m.low_52w, hi: m.high_52w, color: "#4b525c" },
          { label: "Street targets (low–high)", lo: c.low, hi: c.high, color: "#6b5a2a" },

          {

            hi: Math.max(...exits),
            color: "#2f6db3",

          { label: "Monte Carlo p10–p90", lo: R.mc.p10, hi: R.mc.p90, color: "#2a7f62" },
          ...Object.keys(rt)
            .filter((k) => rt[k].usable)
            .map((k) => ({
              label: `Comps ${{ pe_fwd: "fwd P/E", ev_ebitda: "EV/EBITDA", ev_sales: "EV/Sales" }[k] || k} (IQR)`,
              lo: Math.min(rt[k].impliedQ1, rt[k].impliedQ3),
              hi: Math.max(rt[k].impliedQ1, rt[k].impliedQ3),
              color: "#7a4fb3",
            })),
          {
            label: "P/E–growth regression ±5pp g",
            lo: Math.min(regLo, regHi),
            hi: Math.max(regLo, regHi),
            color: "#7a4fb3",

      }
      function ffLines(R) {

          {

      RENDER.DES = (R) => {

        return `
  <div class="title"><h1>DES · ${I.meta.name} — valuation summary</h1><div class="sub">Scenario: ${S.scen} · valuation date ${I.meta.valuation_date}</div></div>

        <tr><td>All-segment growth ${Y(1)}–${Y(4)} (shift)</td><td></td><td>${spct(R.rev.all)} each year</td><td></td></tr>
        <tr><td>Terminal growth</td><td>${pct(I.terminal.g, 2)}</td><td>${isFinite(R.rev.g) ? pct(R.rev.g, 2) : "not reachable below WACC"}</td><td></td></tr>

      <tr class="sum hl"><td>Blended fair value</td><td>${px(v.fair)}</td><td class="${cls(v.upside)}">${spct(v.upside)}</td><td class="mut">${v.call}</td></tr>

    <section class="box"><h2>Football field <span>full view in FFLD</span></h2><div class="chart"><canvas id="cFF"></canvas></div></section>
  </div>`;
      };
      RENDER.DES.after = (R) => {
        const P = S.inp.history.prices;
        chart("cPrice", {
          type: "line",
          data: {
            labels: P.map((p) => p[0].slice(5)),

          d = d.trim().replace(/"/g, "");

          const t = new Date(d);
          if (isNaN(t)) return null;
          return (
            t.getFullYear() +

      function heat(grid, rowsV, colsV, rf, cf, price, cur) {
        const flat = grid.flat().filter(isFinite),
          lo = Math.min(...flat),
          hi = Math.max(...flat);
        const color = (v) => {
          if (!isFinite(v)) return "#262b33";
          const t = (v - price) / Math.max(price - lo, hi - price, 1);
          const a = Math.min(1, Math.abs(t));
          return t < 0 ? `rgba(255,77,77,${0.25 + 0.65 * a})` : `rgba(61,220,132,${0.25 + 0.65 * a})`;
        };

      RENDER.SENS = (R) => {
        const I = S.inp,

        const ws = [-0.02, -0.01, 0, 0.01, 0.02].map((d) => w + d);
        const gs = [0.02, 0.025, 0.03, 0.035, 0.04];
        const g1 = M.sensitivity(I, sc, "wacc", ws, "g", gs);
        const I2 = M.clone(I);
        I2.terminal.method = "exit";
        const ms = [8, 10, 12, 14, 16];
        const g2 = M.sensitivity(I2, sc, "wacc", ws, "exit_multiple", ms);
        const a0 = sc.growth[KS()][0],
          c0 = sc.margins[KM()][1];
        const ai = [-0.35, -0.2, 0, 0.2, 0.4].map((d) => a0 + d),
          cm = [-0.04, -0.02, 0, 0.02, 0.04].map((d) => c0 + d);
        const g3 = M.sensitivity(I, sc, "ai_fy28", ai, "core_margin_lr", cm);

        const qs = RS.jsonOf(
          await page(RS.Y.summary(t, crumb), "Quote, consensus estimates, price targets, ratings"),
        ).quoteSummary;
        if (!qs || !qs.result || !qs.result[0]) throw { code: "bad_ticker" };
        const summary = qs.result[0];
        const annual = RS.series(
          RS.jsonOf(
            await page(RS.Y.timeseries(t, "annual"), "Annual income statement, balance sheet, cash flow"),
          ).timeseries.result,
        );
        const quarterly = RS.series(
          RS.jsonOf(await page(RS.Y.timeseries(t, "quarterly"), "Quarterly statements")).timeseries.result,
        );
        const stock = RS.closes(
          RS.jsonOf(await page(RS.Y.chart(t, "2y"), `Two years of daily prices for ${t}`)).chart.result[0],
        );
        const index = RS.closes(
          RS.jsonOf(await page(RS.Y.chart("^GSPC", "2y"), "Two years of daily S&P 500 prices")).chart
            .result[0],
        );
        const tnx = RS.jsonOf(await page(RS.Y.chart("^TNX", "5d"), "10-year Treasury yield")).chart.result[0]
          .meta.regularMarketPrice;
        let peers = peerList;
        if (!peers.length) {
          try {
            peers = (
              RS.jsonOf(await page(RS.Y.recs(t), "Related tickers")).finance.result[0].recommendedSymbols ||
              []
            )
              .map((x) => x.symbol)
              .slice(0, 6);
          } catch (e) {
            peers = [];
          }
        }
        const peerData = {};
        for (const p of peers) {
          try {
            const r = RS.jsonOf(await page(RS.Y.peerSummary(p, crumb), `Peer ${p}`)).quoteSummary;
            peerData[p] = r && r.result ? r.result[0] : null;
            if (!peerData[p]) logLine(`  ${p}: no data, skipped`, "err");
          } catch (e) {
            logLine(`  ${p}: ${e.message || e.code}`, "err");
          }
        }
        logLine("Building the model from the feeds…");
        const inp = RS.build(
          {
            ticker: t,
            summary,
            annual,
            quarterly,
            stock,
            index,
            tnx,
            peers: peerData,
            today: new Date().toISOString().slice(0, 10),
          },
          M,
        );
        if (inp.market.price == null || !inp.rev_y0) throw { code: "bad_ticker" };
        M.dcf(inp, inp.scenarios.Base); // throws on an impossible setup (e.g. g ≥ WACC)
        return inp;
      }

      <p class="note">The same file drives the other two tools: <code>python excel_model.py FILE.json</code> writes the live-formula Excel workbook, and <code>valuation_framework.ipynb</code> walks through every step with the formulas printed.</p></section>
    <section class="box"><h2>The framework <span>same engine, same numbers, three ways to work</span></h2><div class="kv">

      };
      RENDER.LOAD.after = () => {

      // ---------------------------------------------------------------- audit
      function auditRows() {
        const P = S.inp.provenance || {};
        const base = M.dcf(S.inp, S.inp.scenarios[S.scen]).perShare;
        const rows = [];
        for (const [path, [kind, source]] of Object.entries(P)) {
          let v;
          try {
            v = get(S.inp, path);
          } catch (e) {
            continue;
          }
          if (typeof v !== "number") continue;
          if (path.startsWith("scenarios.") && !path.startsWith(`scenarios.${S.scen}.`)) continue;
          let impact = null;
          if (!(path === "capital.beta_custom" && S.inp.capital.beta_source !== "custom")) {
            try {
              const I = M.clone(S.inp);
              const bump = Math.abs(v) < 1 ? v + 0.01 : v * 1.1;
              set(I, path, bump);
              impact = M.dcf(I, I.scenarios[S.scen]).perShare - base;
            } catch (e) {
              impact = null;
            }
          }
          rows.push({ path, v, kind, source, impact, step: Math.abs(v) < 1 ? "+1pp" : "+10%" });
        }
        return rows;
      }
      RENDER.AUD = () => {
        const rows = auditRows(),
          n = (k) => rows.filter((r) => r.kind === k).length;
        const fmtv = (r) =>
          Math.abs(r.v) < 1 && !/beta|multiple|dilution/.test(r.path) ? pct(r.v, 2) : f2(r.v);
        const assum = rows
          .filter((r) => r.kind === "assumption" && r.impact != null && Math.abs(r.impact) > 0.005)
          .sort((a, b) => Math.abs(b.impact) - Math.abs(a.impact));
        const badge = (k) =>
          `<span class="pv ${k === "sourced" ? "s" : k === "derived" ? "d" : "a"}">${k[0].toUpperCase()}</span>`;
        return `
  <div class="title"><h1>AUD · Where every input comes from</h1><div class="sub">${S.inp.meta.ticker} · ${S.scen} case · S = sourced, D = derived from sourced numbers, A = assumption</div></div>
  <div class="grid">
    <section class="box c4"><h2>Inputs by origin</h2><div class="kv">
      <span>${badge("sourced")} Sourced from filings or data feeds</span><span>${n("sourced")}</span>
      <span>${badge("derived")} Derived from sourced numbers</span><span>${n("derived")}</span>
      <span>${badge("assumption")} Assumptions (modelling choices)</span><span>${n("assumption")}</span></div>
      <p class="note">Sourced and derived inputs come straight from filings or data feeds, with the formula for derived ones. Assumptions are modelling choices: change them in MODEL, WACC or DCF and the valuation updates. The table on the right ranks them by how much they move the DCF.</p></section>
    <section class="box c8"><h2>Assumptions that move the value most <span>change in DCF $/share for the step shown</span></h2><div class="scroll"><table>

        .slice(0, 12)
        .map(
          (r) =>
            `<tr><td>${r.path}</td><td>${fmtv(r)}</td><td>${r.step}</td><td class="${cls(r.impact)}">${r.impact >= 0 ? "+" : ""}${f2(r.impact)}</td><td class="l mut" style="white-space:normal">${r.source}</td></tr>`,
        )
        .join("")}
      </tbody></table></div></section>
    <section class="box"><h2>All inputs <span>${rows.length} with a recorded source</span></h2><div class="scroll"><table>
      <thead><tr><th>Input</th><th>Value</th><th>Origin</th><th class="l">Source / basis</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td>${r.path}</td><td>${fmtv(r)}</td><td>${badge(r.kind)}</td><td class="l mut" style="white-space:normal">${r.source}</td></tr>`).join("")}
      </tbody></table></div></section>
  </div>`;
      };

      // ---------------------------------------------------------------- financials (banks, insurers, REITs)
      // Same tabs, different engine: excess-return model (book + PV of ROE above Ke) or dividend discount model.
      const FINR = {};
      const isER = () => S.inp.model === "excess_return";
      const MODEL_NAME = {
        fcff: "FCFF DCF",
        excess_return: "Excess-return model",
        ddm: "Dividend discount model",
      };
      const finName = () => MODEL_NAME[S.inp.model] || "DCF";
      const short = () => (isER() ? "Excess return" : "DDM");
      function finModelPicker() {
        const alt = S.inp.alt_models || {};

        if (opts.length < 2) return `<b>${finName()}</b>`;

      }
      function switchFinModel(to) {
        const I = S.inp;
        if (to === I.model || !(I.alt_models || {})[to]) return;
        I.alt_models[I.model] = {
          scenarios: I.scenarios,
          relative_weights: I.relative.weights,
          verdict_weights: I.verdict.weights,
        };
        const n = I.alt_models[to];
        I.model = to;
        I.scenarios = n.scenarios;
        I.relative.weights = n.relative_weights;
        I.verdict.weights = n.verdict_weights;
        delete I.alt_models[to];
        S.mcKey = "";
        render();
      }
      const multName = {
        pe_fwd: "Forward P/E",
        pb: "Price / book",
        div_yield: "Dividend yield",
        ev_ebitda: "EV / EBITDA (TTM)",
        ev_sales: "EV / Sales (TTM)",
      };
      const multFmt = (k, x) => (k === "div_yield" ? pct(x, 2) : mx(x));

      function finFfItems(R) {
        const I = S.inp,
          c = I.consensus.targets,
          m = I.market,
          sc = R.scen3,
          rt = R.rel.table,
          k = R.W.ke,
          scen = I.scenarios[S.scen];
        const g = M.sensitivity(I, scen, "wacc", [k - 0.01, k + 0.01], "g", [
          I.terminal.g - 0.005,
          I.terminal.g + 0.005,
        ])
          .flat()
          .filter(isFinite);
        const out = [
          { label: "52-week range", lo: m.low_52w, hi: m.high_52w, color: "#4b525c" },
          { label: "Street targets (low–high)", lo: c.low, hi: c.high, color: "#6b5a2a" },
          { label: `${short()} bear–bull`, lo: sc.Bear.perShare, hi: sc.Bull.perShare, color: "#2f6db3" },
          { label: `${short()} Ke ±1pp, g ±0.5pp`, lo: Math.min(...g), hi: Math.max(...g), color: "#2f6db3" },
        ];
        if (isER()) {
          const r = [-0.02, 0.02].map((d) => M.valueAt(I, scen, "roe_lr", scen.roe[1] + d));
          out.push({ label: "Long-run ROE ±2pp", lo: Math.min(...r), hi: Math.max(...r), color: "#2f6db3" });
        } else {
          const r = [-0.01, 0.01].map((d) => M.valueAt(I, scen, "dps_shift", d));
          out.push({
            label: "Dividend growth ±1pp",
            lo: Math.min(...r),
            hi: Math.max(...r),
            color: "#2f6db3",
          });
        }
        out.push({ label: "Monte Carlo p10–p90", lo: R.mc.p10, hi: R.mc.p90, color: "#2a7f62" });
        for (const key of Object.keys(rt))
          if (rt[key].usable) {
            const a = rt[key].impliedQ1,
              b = rt[key].impliedQ3;
            out.push({
              label: `Comps ${multName[key]} (IQR)`,
              lo: Math.min(a, b),
              hi: Math.max(a, b),
              color: "#7a4fb3",
            });
          }
        if (isER() && isFinite(R.reg.implied)) {
          const bv = I.fin.bv0 / M.dilutedShares(I),
            v = [-0.02, 0.02].map((d) => (R.reg.a + R.reg.b * (I.fin.roe_ttm + d)) * bv);
          out.push({
            label: "P/B–ROE regression ±2pp ROE",
            lo: Math.min(...v),
            hi: Math.max(...v),
            color: "#7a4fb3",
          });
        }
        return out.filter((d) => isFinite(d.lo) && isFinite(d.hi));
      }

      FINR.DES = (R) => {
        const I = S.inp,
          v = R.ver,
          b = R.base,
          sc = R.scen3,
          c = I.consensus.targets,
          vw = I.verdict.weights,
          m = I.market;
        const chip = v.call === "OVERVALUED" ? "over" : v.call === "UNDERVALUED" ? "under" : "fair";
        const wts = Object.entries(I.relative.weights).filter(([, w]) => w > 0);
        const methods = [
          [`${short()} — Bear`, sc.Bear.perShare, ""],
          [`${short()} — Base`, sc.Base.perShare, ""],
          [`${short()} — Bull`, sc.Bull.perShare, ""],
          ["Monte Carlo median", R.mc.median, `p10 ${px(R.mc.p10)} · p90 ${px(R.mc.p90)}`],
          [
            `Comps blend (${wts.map(([k]) => multName[k]).join(" · ")})`,
            R.rel.blended,
            wts.map(([, w]) => pct(w, 0)).join("/"),
          ],
        ];
        if (isER())
          methods.push([
            "P/B–ROE regression",
            R.reg.implied,
            isFinite(R.reg.r2) ? `R² ${R.reg.r2.toFixed(2)}, n=${R.reg.n}` : `n=${R.reg.n} (too few peers)`,
          ]);
        methods.push(["Street median target (12m)", c.median, `${c.n} analysts`]);
        const bvps = I.fin.bv0 / M.dilutedShares(I);
        const revRows = isER()
          ? `
        <tr><td>Cost of equity</td><td>${pct(R.W.ke, 2)}</td><td>${pct(R.rev.ke, 2)}</td><td>${spct(R.rev.ke - R.W.ke, 2)}</td></tr>
        <tr><td>Long-run ROE (from ${Y(4)})</td><td>${pct(I.scenarios[S.scen].roe[1], 1)}</td><td>${pct(R.rev.roe, 1)}</td><td>${spct(R.rev.roe - I.scenarios[S.scen].roe[1], 1)}</td></tr>
        <tr><td>Share of the ROE spread kept forever</td><td>${pct(I.terminal.er_persistence ?? 1, 0)}</td><td>${isFinite(R.rev.persist) ? pct(R.rev.persist, 0) : "not reachable in 0–100%"}</td><td></td></tr>
        <tr><td>Terminal growth</td><td>${pct(I.terminal.g, 2)}</td><td>${isFinite(R.rev.g) ? pct(R.rev.g, 2) : "not reachable below Ke"}</td><td></td></tr>`
          : `
        <tr><td>Cost of equity</td><td>${pct(R.W.ke, 2)}</td><td>${pct(R.rev.ke, 2)}</td><td>${spct(R.rev.ke - R.W.ke, 2)}</td></tr>
        <tr><td>Dividend growth ${Y(0)}–${Y(3)} (shift)</td><td>${I.scenarios[S.scen].dps_growth.map((x) => pct(x, 1)).join(" · ")}</td><td>${spct(R.rev.dps, 2)} each year</td><td></td></tr>
        <tr><td>Terminal growth</td><td>${pct(I.terminal.g, 2)}</td><td>${isFinite(R.rev.g) ? pct(R.rev.g, 2) : "not reachable below Ke"}</td><td></td></tr>`;
        return `
  <div class="title"><h1>DES · ${I.meta.name} — valuation summary</h1><div class="sub">${finModelPicker()} · ${I.meta.industry || ""} · scenario ${S.scen} · valuation date ${I.meta.valuation_date}</div></div>
  <div class="grid">
    <section class="box c5">
      <h2>Verdict <span>weights: ${short()} ${pct(vw.dcf, 0)} · MC ${pct(vw.mc, 0)} · comps ${pct(vw.comps, 0)} · regression ${pct(vw.regression, 0)}</span></h2>
      <div class="verdict">
        <div><div class="k">Fair value / share</div><div class="big">${px(v.fair)}</div></div>
        <div><div class="k">vs price ${px(m.price)}</div><div class="big ${cls(v.upside)}">${spct(v.upside)}</div></div>
        <div><div class="k">Call</div><div style="margin-top:6px"><span class="chip ${chip}" style="font-size:15px">${v.call}</span></div></div>
      </div>
      <div class="kv" style="margin-top:12px">

      });
      document.addEventListener("change", (e) => {
        const el = e.target;
        if (el.matches("input.f[data-p]")) {
          const raw = parseFloat(el.value);
          if (!isFinite(raw)) {
            render();
            return;
          }
          set(S.inp, el.dataset.p, el.dataset.k === "pct" ? raw / 100 : raw);
          render();
        } else if (el.id === "coSel") {
          switchCompany(el.value);
        } else if (el.id === "finModel") {
          switchFinModel(el.value);
        } else if (el.id === "eqGate") {
          S.inp.verdict.quality_gate = el.value === "on";
          render();
        } else if (el.id === "betaSrc") {
          S.inp.capital.beta_source = el.value;
          render();
        } else if (el.id === "tvMethod") {
          S.inp.terminal.method = el.value;
          render();
        } else if (el.id === "relStat") {
          S.inp.relative.stat = el.value;
          render();
        } else if (el.matches("[data-peer]")) {
          const tk = el.dataset.peer,
            cs = S.inp.peers.core_set;
          if (el.checked && !cs.includes(tk)) cs.push(tk);
          if (!el.checked) {
            if (cs.length <= 2) {
              el.checked = true;
              return;
            }
            cs.splice(cs.indexOf(tk), 1);
          }
          render();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.matches("input.f[data-p]"))
          e.target.dispatchEvent(new Event("change", { bubbles: true }));
      });
      $("cmdForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const words = $("cmdInput").value.toUpperCase().replace(/<GO>/g, "").split(/\s+/).filter(Boolean);
        const hit = words.reverse().find((w) => TABS.some((t) => t[0] === w));
        if (hit) {
          go(hit);
          $("cmdInput").value = "";
          return;
        }
        const tk = words
          .reverse()
          .find((w) => /^[A-Z][A-Z0-9.\-]{0,9}$/.test(w) && !["US", "EQUITY", "GO"].includes(w));
        if (tk) {
          if (companyData(tk)) {
            switchCompany(tk);
          } else {
            LOADSTATE.ticker = tk;
            go("LOAD");
          }
          $("cmdInput").value = "";
          return;
        }
        $("cmdInput").value = "UNKNOWN FUNCTION — TRY " + TABS.map((t) => t[0]).join(" ") + " OR A TICKER";
      });
      $("resetBtn").addEventListener("click", () => {
        S.inp = M.clone(companyData(CO.active) || DATA);
        render();
      });
      function switchCompany(t) {
        const d = companyData(t);
        if (!d) return;
        CO.active = t;
        saveCompanies();
        S.inp = M.clone(d);
        S.mcKey = "";
        S.scen = "Base";
        go(S.tab === "LOAD" ? "DES" : S.tab);
      }
      render();
    </script>
