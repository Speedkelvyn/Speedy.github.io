extend-exclude = ["*.ipynb"]
line-length = 110
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
# Typographic characters (−, ×, ·, –) are deliberate in user-facing text.
ignore = ["RUF001", "RUF002", "RUF003", "E731", "E501"]  # E501: line length is handled by the formatter

[lint.per-file-ignores]
"**/tests/*" = ["E501"]

[format]
quote-style = "double"

[lint.isort]
# local modules imported by sibling scripts
known-first-party = ["fx_forecasting", "models", "valuation_v2", "excel_model", "research", "framework", "run_valuation", "gmail_reader"]
