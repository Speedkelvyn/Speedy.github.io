extend-exclude = ["*.ipynb"]
line-length = 110
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
# Typographic characters (−, ×, ·, –) are deliberate in user-facing text.
ignore = ["RUF001", "RUF002", "RUF003", "E731", "E501"]  # E501: line length is handled by the formatter

[lint.per-file-ignores]
"**/tests/*" = ["E501"]

[format]
quote-style = "double"

[lint.isort]
# local modules imported by sibling scripts
known-first-party = [
    "credit_data", "credit_models", "credit_eval",
    "vol_data", "vol_models", "vol_baselines", "vol_eval",
    "rec_data", "rec_models", "rec_eval",
    "ind_data", "ind_models", "ind_eval",
    "valuation_v2", "excel_model", "research", "framework", "run_valuation", "value_ticker", "build_page",
]  # fmt: skip
