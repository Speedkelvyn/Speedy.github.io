name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html:
    name: Validate and format check (HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes html-validate@8.24.1 $(git ls-files '*.html')
      - run: npx --yes prettier@3.3.3 --check $(git ls-files '*.html' '*.js')
