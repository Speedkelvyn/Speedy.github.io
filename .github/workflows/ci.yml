name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest numpy pandas openpyxl scipy
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q valuations/engine/tests projects/credit-spreads/tests

  html:
    name: Validate and format check (HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes html-validate@8.24.1 $(git ls-files '*.html' ':!projects/credit-spreads/index.html')
      - run: npx --yes prettier@3.3.3 --check $(git ls-files '*.html' '*.js')
